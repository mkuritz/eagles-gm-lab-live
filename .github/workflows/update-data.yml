name: Update live data

on:
  schedule:
    # Primary schedule lives in the Cloudflare sl-scheduler (7 AM daily + every 3h on game days). Sparse daily backup:
    - cron: "0 14 * * *"   # ~10 AM ET
  workflow_dispatch:

permissions: {}   # least privilege by default; write scope granted per job below

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyarrow==17.*
      - name: Fetch data
        run: python scripts/fetch_data.py
      - name: Performance scores (nflverse)
        run: python scripts/performance.py || echo "performance step failed; keeping previous file"
      - name: Cross-check free sources (optional)
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/eagles_xcheck.py
      - name: Season guard (current season from date + same-day live roster check)
        continue-on-error: true
        run: python scripts/season_guard.py
      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898475+github-actions[bot]@users.noreply.github.com"
          git add data/
          # meta.json always records the run time; commit only if a real data file changed
          if git diff --cached --quiet -- data/ ':!data/meta.json'; then
            echo "No data changes"; exit 0
          fi
          git commit -m "Update live data $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          git push
