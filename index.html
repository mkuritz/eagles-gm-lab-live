<style>
:root {
  --bg: #0a1314; --bg-2: #0f1c1d; --surface: #132424; --surface-2: #183030; --surface-3: #1f3b3a;
  --border: rgba(165, 172, 175, 0.14); --border-strong: rgba(165, 172, 175, 0.3);
  --text: #e7eeec; --text-2: #aab6b3; --text-3: #7d8a87;
  --brand: #004c54; --brand-2: #0a6d78; --accent: #2cc1b0; --accent-ink: #052321;
  --pos: #5ed26a; --neg: #ff6b6b; --warn: #f5b942; --silver: #a5acaf;
  --radius: 10px; --radius-sm: 6px; --shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 8px 24px rgba(0,0,0,0.35);
  --font: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sidebar-w: 236px; --header-h: 60px;
  --t-xs: 11px; --t-sm: 12.5px; --t-base: 14px; --t-md: 16px; --t-lg: 20px; --t-xl: 28px; --t-2xl: 36px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; max-width: 100vw; overflow-x: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--t-base); line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.num, td.num, .kpi-value, .stat-value, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums lining-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Layout */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; grid-template-rows: var(--header-h) 1fr; height: 100dvh; }
.sidebar { grid-row: 1 / -1; background: var(--bg-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; }
.header { grid-column: 2; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--s-5); background: rgba(10,19,20,0.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.main { grid-column: 2; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: var(--s-5); scroll-behavior: smooth; min-width: 0; }
.main:focus { outline: none; }

.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; border-bottom: 1px solid var(--border); }
.brand svg { flex: none; }
.brand-name { font-weight: 600; font-size: var(--t-base); letter-spacing: -0.01em; line-height: 1.15; }
.brand-sub { font-size: var(--t-xs); color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
.nav { padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: var(--t-xs); color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; padding: 12px 10px 6px; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border-radius: var(--radius-sm); border: 1px solid transparent; background: transparent; color: var(--text-2); font-size: 13.5px; transition: background .15s, color .15s; }
.nav-btn:hover { background: var(--surface); color: var(--text); }
.nav-btn[aria-current="page"] { background: var(--surface-2); color: var(--text); border-color: var(--border); }
.nav-btn .ico { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav-btn .badge { margin-left: auto; font-size: var(--t-xs); background: var(--surface-3); color: var(--text-2); border-radius: 999px; padding: 1px 7px; }
.nav-btn .badge.bad { background: rgba(255,107,107,.18); color: var(--neg); }
.nav-btn .badge.ok { background: rgba(94,210,106,.15); color: var(--pos); }
.sidebar-foot { margin-top: auto; padding: 14px 18px; border-top: 1px solid var(--border); font-size: var(--t-xs); color: var(--text-3); line-height: 1.5; }
.sidebar-foot b { color: var(--text-2); font-weight: 500; }

.header > div { min-width: 0; }
.header h1 { font-size: var(--t-md); font-weight: 600; margin: 0; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scenario-select { display: none; }
.header .crumb { color: var(--text-3); font-size: var(--t-sm); }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.menu-btn { display: none; }
.save-state { font-size: var(--t-xs); color: var(--text-3); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.save-state .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pos); }
.save-state.dirty .dot { background: var(--warn); }
.save-state.error .dot { background: var(--neg); }

/* Scenario switcher */
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px; }
.seg button { padding: 5px 11px; font-size: var(--t-sm); border: 0; background: transparent; color: var(--text-2); border-radius: 4px; }
.seg button[aria-pressed="true"] { background: var(--brand-2); color: #fff; }
.seg button:hover:not([aria-pressed="true"]) { color: var(--text); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); font-size: var(--t-sm); font-weight: 500; transition: background .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: var(--surface-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--neg); border-color: rgba(255,107,107,.35); }
.btn.danger:hover { background: rgba(255,107,107,.1); }
.btn.sm { padding: 4px 9px; font-size: var(--t-xs); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface); color: var(--text); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Cards */
.grid { display: grid; gap: var(--s-4); }
.grid.kpis { grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); }
.grid > * { min-width: 0; }
.stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.two { grid-template-columns: 1fr 1fr; }
.grid.three { grid-template-columns: repeat(3, 1fr); }
.grid.sidebar-right { grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--s-4) var(--s-5); box-shadow: var(--shadow); min-width: 0; }
.card.tight { padding: var(--s-3) var(--s-4); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); margin-bottom: var(--s-3); flex-wrap: wrap; }
.card-head h2 { font-size: var(--t-base); font-weight: 600; margin: 0; letter-spacing: -0.005em; }
.card-head .sub { color: var(--text-3); font-size: var(--t-sm); }
.section-title { font-size: var(--t-lg); font-weight: 600; margin: 0 0 4px; letter-spacing: -0.015em; }
.section-sub { color: var(--text-2); font-size: var(--t-sm); margin: 0 0 var(--s-5); max-width: 70ch; }
.stack { display: flex; flex-direction: column; gap: var(--s-4); }

.kpi { padding: var(--s-4); }
.kpi-label { font-size: var(--t-xs); color: var(--text-3); text-transform: uppercase; letter-spacing: 0.07em; }
.kpi-value { font-size: var(--t-xl); font-weight: 600; margin: 4px 0 2px; letter-spacing: -0.02em; transition: color .3s; }
.kpi-value.pos { color: var(--pos); } .kpi-value.neg { color: var(--neg); } .kpi-value.warn { color: var(--warn); }
.kpi-delta { font-size: var(--t-sm); color: var(--text-2); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.kpi-delta .arrow { font-weight: 600; }
.kpi-delta.pos .arrow { color: var(--pos); } .kpi-delta.neg .arrow { color: var(--neg); }

/* Alerts */
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: grid; grid-template-columns: 10px 1fr; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-2); font-size: var(--t-sm); align-items: start; }
.alert .bar { width: 4px; height: 100%; min-height: 28px; border-radius: 2px; margin-top: 2px; }
.alert.critical .bar { background: var(--neg); } .alert.warn .bar { background: var(--warn); } .alert.ok .bar { background: var(--pos); }
.alert b { font-weight: 600; display: block; margin-bottom: 1px; }
.alert span { color: var(--text-2); }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
thead th { position: sticky; top: 0; z-index: 1; background: var(--surface-2); color: var(--text-2); font-weight: 500; text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border-strong); white-space: nowrap; font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .05em; }
thead th.num, td.num { text-align: right; }
thead th[data-sort] { cursor: pointer; user-select: none; }
thead th[data-sort]:hover { color: var(--text); }
thead th .sort-ind { opacity: .6; margin-left: 3px; }
tbody td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: rgba(255,255,255,0.025); }
tbody tr.selected td { background: rgba(44,193,176,0.08); }
tfoot td { padding: 9px 10px; font-weight: 600; background: var(--surface-2); border-top: 1px solid var(--border-strong); }
td.pos { color: var(--pos); } td.neg { color: var(--neg); } td.muted { color: var(--text-3); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: var(--t-xs); background: var(--surface-3); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
.tag.v { color: var(--pos); border-color: rgba(94,210,106,.3); } .tag.d { color: var(--warn); border-color: rgba(245,185,66,.3); } .tag.e { color: var(--silver); }
.tag.hi { color: var(--pos); } .tag.med { color: var(--warn); } .tag.low { color: var(--text-3); }
.tag.crit { color: var(--neg); border-color: rgba(255,107,107,.3); }
.sticky-col th:first-child, .sticky-col td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 2; }
.sticky-col thead th:first-child { z-index: 3; background: var(--surface-2); }

/* Controls */
.control { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.control:last-child { border-bottom: 0; }
.control label { font-size: var(--t-sm); color: var(--text); }
.control .hint { grid-column: 1; font-size: var(--t-xs); color: var(--text-3); }
.control .val { font-family: var(--mono); font-size: var(--t-sm); color: var(--accent); text-align: right; min-width: 72px; }
.control input[type=range] { grid-column: 1 / -1; width: 100%; }
input[type=range] { -webkit-appearance: none; appearance: none; height: 22px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; background: var(--surface-3); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 4px; background: var(--surface-3); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--accent); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
input[type=range]:disabled::-webkit-slider-thumb { background: var(--text-3); box-shadow: none; }
select, input[type=text], input[type=number], textarea { background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 7px 10px; font-size: var(--t-sm); color: var(--text); min-width: 0; }
select:focus, input:focus, textarea:focus { border-color: var(--accent); outline: none; }
textarea { width: 100%; min-height: 110px; resize: vertical; line-height: 1.5; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.toggle-group { display: inline-flex; gap: 0; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
.toggle-group button { padding: 4px 9px; border: 0; background: transparent; color: var(--text-2); font-size: var(--t-xs); white-space: nowrap; }
.toggle-group button[aria-pressed="true"] { background: var(--brand-2); color: #fff; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: var(--t-xs); color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
.field .toggle-group { align-self: flex-start; }
.row { display: flex; gap: var(--s-3); align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: var(--s-3); }
.stat { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
.stat-label { font-size: var(--t-xs); color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
.stat-value { font-size: var(--t-lg); font-weight: 600; margin-top: 2px; }
.stat-value.pos { color: var(--pos); } .stat-value.neg { color: var(--neg); } .stat-value.warn { color: var(--warn); }
.stat-sub { font-size: var(--t-xs); color: var(--text-3); margin-top: 2px; }
.big-number { font-size: var(--t-2xl); font-weight: 600; letter-spacing: -0.025em; line-height: 1.05; }
.big-number.pos { color: var(--pos); } .big-number.neg { color: var(--neg); } .big-number.warn { color: var(--warn); }
.progress { height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s ease; }
.progress.neg > div { background: var(--neg); }
.progress.ok > div { background: var(--pos); }

/* Tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: var(--s-4); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { padding: 8px 14px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--text-2); font-size: var(--t-sm); white-space: nowrap; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--text); }

/* Charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--mono); font-size: 11px; fill: var(--text-3); }
.chart .axis line, .chart .grid line { stroke: var(--border); }
.chart .zero { stroke: var(--text-3); stroke-dasharray: 3 3; }
.chart .label { fill: var(--text-2); font-family: var(--font); }
.chart .bar { transition: height .35s ease, y .35s ease, width .35s ease, x .35s ease; }
.chart .bar:hover { filter: brightness(1.2); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--t-xs); color: var(--text-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart-tip { position: fixed; pointer-events: none; z-index: 50; background: var(--surface-3); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 6px 9px; font-size: var(--t-xs); font-family: var(--mono); color: var(--text); box-shadow: 0 6px 20px rgba(0,0,0,.4); display: none; white-space: nowrap; }

/* Prospect cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--s-3); }
.pcard { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; display: flex; flex-direction: column; gap: 6px; transition: border-color .15s; }
.pcard.on { border-color: var(--accent); background: rgba(44,193,176,0.06); }
.pcard .name { font-weight: 600; font-size: var(--t-base); }
.pcard .meta { font-size: var(--t-xs); color: var(--text-3); }
.pcard .need { font-size: var(--t-xs); color: var(--text-2); }
.pcard .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.grade { font-family: var(--mono); font-weight: 600; color: var(--accent); }
.empty { padding: var(--s-6) var(--s-4); text-align: center; color: var(--text-3); font-size: var(--t-sm); border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); }
.empty b { color: var(--text-2); display: block; margin-bottom: 4px; font-weight: 500; }

/* Toasts / modal */
.toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 100; max-width: min(380px, calc(100vw - 40px)); }
.toast { background: var(--surface-3); border: 1px solid var(--border-strong); border-left: 3px solid var(--accent); border-radius: var(--radius-sm); padding: 10px 14px; font-size: var(--t-sm); box-shadow: 0 10px 30px rgba(0,0,0,.45); animation: toast-in .2s ease; }
.toast.error { border-left-color: var(--neg); } .toast.warn { border-left-color: var(--warn); } .toast.ok { border-left-color: var(--pos); }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 90; padding: 20px; }
.modal-bg.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: var(--s-5); width: min(520px, 100%); max-height: 90dvh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.modal h3 { margin: 0 0 8px; font-size: var(--t-md); }
.modal p { color: var(--text-2); font-size: var(--t-sm); margin: 0 0 var(--s-4); }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: var(--s-4); }
kbd { font-family: var(--mono); font-size: var(--t-xs); background: var(--bg-2); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; }
.shortcuts { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: var(--t-sm); color: var(--text-2); }

/* QA */
.qa-list { display: flex; flex-direction: column; gap: 4px; font-family: var(--mono); font-size: var(--t-xs); }
.qa-item { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; padding: 6px 10px; border-radius: 4px; background: var(--bg-2); border: 1px solid var(--border); align-items: center; }
.qa-item .st { font-weight: 600; } .qa-item.pass .st { color: var(--pos); } .qa-item.fail .st { color: var(--neg); }
.qa-item .err { grid-column: 2 / -1; color: var(--neg); white-space: pre-wrap; }
.qa-item .ms { color: var(--text-3); }
.qa-group { font-size: var(--t-xs); color: var(--text-3); text-transform: uppercase; letter-spacing: .07em; margin: 12px 0 6px; }
.log { font-family: var(--mono); font-size: var(--t-xs); color: var(--text-2); background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; max-height: 240px; overflow: auto; white-space: pre-wrap; }

.hidden { display: none !important; }
.muted { color: var(--text-3); }
.small { font-size: var(--t-xs); }
.right { text-align: right; }
hr.sep { border: 0; border-top: 1px solid var(--border); margin: var(--s-4) 0; }
.waterfall-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: var(--t-sm); }
.waterfall-row:last-child { border-bottom: 0; }

const U = {
  fm(x, opts = {}) { // $M formatter
    if (x === null || x === undefined || Number.isNaN(x)) return '—';
    const sign = x < 0 ? '−' : (opts.plus && x > 0 ? '+' : '');
    const v = Math.abs(x);
    const digits = opts.digits !== undefined ? opts.digits : (v >= 100 ? 1 : v >= 10 ? 1 : 2);
    return `${sign}$${v.toFixed(digits)}M`;
  },
  pct(x, d = 1) { return `${x.toFixed(d)}%`; },
  esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  cls(x) { return x > 0.0001 ? 'pos' : x < -0.0001 ? 'neg' : ''; },
  uid() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); },
  debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  prov(p) { const m = { V: ['v', 'Verified'], D: ['d', 'Derived'], E: ['e', 'Estimate'] }; const [c, l] = m[p] || ['e', 'Estimate']; return `<span class="tag ${c}" title="${l} — see Data & Sources">${p}</span>`; },
  tag(text, cls = '') { return `<span class="tag ${cls}">${U.esc(text)}</span>`; },
  download(filename, text, type = 'application/json') {
    const blob = new Blob([text], { type }); const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  },
  csv(rows) { return rows.map((r) => r.map((c) => { const s = String(c ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(',')).join('\n'); },
};

  let memory = {}; let available = true; let lastError = null;
  function probe() {

    catch (e) { available = false; lastError = e; }

  }
  function get(key) {

  }
  function remove(key) { delete memory[key]; try { localStorage.removeItem(key); } catch (e) { /* ignore */ } }

/* ---------------- Charts (SVG, dependency-free) ---------------- */
const Charts = (() => {
  const C = { committed: '#2f6f73', roster: '#6c8d8f', ext: '#b88b2e', dead: '#c75450', push: '#8b5fbf', pos: '#5ed26a', neg: '#ff6b6b', accent: '#2cc1b0', band: 'rgba(44,193,176,0.18)', band2: 'rgba(44,193,176,0.32)', silver: '#a5acaf' };
  const ns = 'http://www.w3.org/2000/svg';
  const tipEl = () => document.getElementById('chartTip');
  function fmt(v) { return (v < 0 ? '−' : '') + '$' + Math.abs(v).toFixed(1) + 'M'; }
  function niceMax(v) { if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10; return m * p; }
  function svg(w, h, label) { return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${U.esc(label)}" preserveAspectRatio="xMidYMid meet">`; }

  // Stacked bar with a cap marker per category and a value label on top
  function stacked({ categories, series, markers, labels, label, height = 300 }) {
    const w = 720, h = height, mL = 52, mR = 16, mT = 28, mB = 32;
    const iw = w - mL - mR, ih = h - mT - mB;
    const totals = categories.map((_, i) => series.reduce((a, s) => a + Math.max(0, s.values[i]), 0));
    const maxV = niceMax(Math.max(...totals, ...(markers ? markers.map((m) => m.value) : [0])) * 1.08);
    const y = (v) => mT + ih - (v / maxV) * ih;
    const bw = iw / categories.length; const barW = bw * 0.56;
    let out = svg(w, h, label);
    for (let i = 0; i <= 5; i++) { const v = (maxV / 5) * i; out += `<g class="grid"><line x1="${mL}" x2="${w - mR}" y1="${y(v)}" y2="${y(v)}"/><text x="${mL - 8}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text></g>`; }
    categories.forEach((cat, i) => {
      const x = mL + bw * i + (bw - barW) / 2; let acc = 0;
      series.forEach((s) => {
        const v = Math.max(0, s.values[i]); if (v <= 0) return;
        const y1 = y(acc + v), hh = y(acc) - y(acc + v);
        out += `<rect class="bar" x="${x}" y="${y1}" width="${barW}" height="${hh}" fill="${s.color}" rx="1.5" data-tip="${U.esc(`${cat} · ${s.label}: ${fmt(v)}`)}"/>`;
        acc += v;
      });
      if (markers && markers[i]) { const m = markers[i]; out += `<line x1="${x - 8}" x2="${x + barW + 8}" y1="${y(m.value)}" y2="${y(m.value)}" stroke="${C.silver}" stroke-width="2" stroke-dasharray="4 3" data-tip="${U.esc(`${cat} · ${m.label}: ${fmt(m.value)}`)}"/>`; }
      if (labels && labels[i] !== undefined) { const lv = labels[i]; const top = Math.min(y(acc), markers && markers[i] ? y(markers[i].value) : y(acc)) - 8; out += `<text x="${x + barW / 2}" y="${top}" text-anchor="middle" fill="${lv < 0 ? C.neg : C.pos}" font-weight="600">${fmt(lv)}</text>`; }
      out += `<text class="label" x="${x + barW / 2}" y="${h - 10}" text-anchor="middle">${cat}</text>`;
    });
    out += '</svg>';
    return out;
  }

  // Horizontal grouped bars (e.g., dead money by player × year)
  function hGroup({ rows, keys, colors, label, rowH = 26 }) {
    const w = 720, mL = 150, mR = 70, mT = 22, mB = 8;
    const h = mT + mB + rows.length * rowH;
    const maxV = niceMax(Math.max(...rows.map((r) => keys.reduce((a, k) => a + (r.values[k] || 0), 0))) * 1.05);
    const iw = w - mL - mR; const x = (v) => mL + (v / maxV) * iw;
    let out = svg(w, h, label);
    for (let i = 0; i <= 4; i++) { const v = (maxV / 4) * i; out += `<g class="grid"><line y1="${mT - 6}" y2="${h - mB}" x1="${x(v)}" x2="${x(v)}"/><text x="${x(v)}" y="${mT - 10}" text-anchor="middle">${Math.round(v)}</text></g>`; }
    rows.forEach((r, i) => {
      const yy = mT + i * rowH; let acc = 0; const total = keys.reduce((a, k) => a + (r.values[k] || 0), 0);
      out += `<text class="label" x="${mL - 10}" y="${yy + rowH / 2 + 4}" text-anchor="end">${U.esc(r.label)}</text>`;
      keys.forEach((k, ki) => { const v = r.values[k] || 0; if (v <= 0) return; out += `<rect class="bar" x="${x(acc)}" y="${yy + 5}" width="${Math.max(0, x(acc + v) - x(acc))}" height="${rowH - 10}" fill="${colors[ki]}" rx="1.5" data-tip="${U.esc(`${r.label} · ${k}: ${fmt(v)}`)}"/>`; acc += v; });
      out += `<text x="${x(total) + 6}" y="${yy + rowH / 2 + 4}" fill="${C.silver}">${fmt(total)}</text>`;
    });
    out += '</svg>';
    return out;
  }

  // Band chart for Monte Carlo
  function band({ years, bands, target, label, height = 300 }) {
    const w = 720, h = height, mL = 52, mR = 16, mT = 20, mB = 32;
    const iw = w - mL - mR, ih = h - mT - mB;
    const all = years.flatMap((y) => [bands[y].p10, bands[y].p90]).concat([target, 0]);
    const lo = Math.min(...all), hi = Math.max(...all); const pad = (hi - lo) * 0.1;
    const rawStep = (hi - lo + 2 * pad) / 5; const mag = Math.pow(10, Math.floor(Math.log10(Math.max(rawStep, 1)))); const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((v) => v >= rawStep) || 10 * mag;
    const yMin = Math.floor((lo - pad) / step) * step, yMax = Math.ceil((hi + pad) / step) * step;

    let out = svg(w, h, label);
    for (let v = yMin; v <= yMax + 1e-9; v += step) { out += `<g class="grid"><line x1="${mL}" x2="${w - mR}" y1="${y(v)}" y2="${y(v)}"/><text x="${mL - 8}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text></g>`; }
    const poly = (k1, k2) => years.map((yr, i) => `${x(i)},${y(bands[yr][k1])}`).concat(years.slice().reverse().map((yr, i) => `${x(years.length - 1 - i)},${y(bands[yr][k2])}`)).join(' ');
    out += `<polygon points="${poly('p90', 'p10')}" fill="${C.band}"/>`;
    out += `<polygon points="${poly('p75', 'p25')}" fill="${C.band2}"/>`;
    out += `<line class="zero" x1="${mL}" x2="${w - mR}" y1="${y(0)}" y2="${y(0)}"/>`;
    out += `<line x1="${mL}" x2="${w - mR}" y1="${y(target)}" y2="${y(target)}" stroke="${C.ext}" stroke-dasharray="5 4"/><text x="${w - mR}" y="${y(target) - 5}" text-anchor="end" fill="${C.ext}">target $${target}M</text>`;
    out += `<polyline fill="none" stroke="${C.accent}" stroke-width="2.5" points="${years.map((yr, i) => `${x(i)},${y(bands[yr].p50)}`).join(' ')}"/>`;
    years.forEach((yr, i) => {
      out += `<circle cx="${x(i)}" cy="${y(bands[yr].p50)}" r="4" fill="${C.accent}" data-tip="${U.esc(`${yr} · P50 ${fmt(bands[yr].p50)} · P10 ${fmt(bands[yr].p10)} · P90 ${fmt(bands[yr].p90)}`)}"/>`;
      out += `<text class="label" x="${x(i)}" y="${h - 10}" text-anchor="middle">${yr}</text>`;
      out += `<text x="${x(i)}" y="${y(bands[yr].p50) - 10}" text-anchor="${i === 0 ? 'start' : i === years.length - 1 ? 'end' : 'middle'}" fill="${C.accent}" font-weight="600">${fmt(bands[yr].p50)}</text>`;
    });
    out += '</svg>';
    return out;
  }

  // Simple vertical grouped bars (void exposure)
  function vGroup({ categories, series, label, height = 260 }) {
    const w = 720, h = height, mL = 52, mR = 16, mT = 20, mB = 46;
    const iw = w - mL - mR, ih = h - mT - mB;
    const maxV = niceMax(Math.max(...series.flatMap((s) => s.values)) * 1.1);
    const y = (v) => mT + ih - (v / maxV) * ih; const bw = iw / categories.length; const gw = bw * 0.7 / series.length;
    let out = svg(w, h, label);
    for (let i = 0; i <= 4; i++) { const v = (maxV / 4) * i; out += `<g class="grid"><line x1="${mL}" x2="${w - mR}" y1="${y(v)}" y2="${y(v)}"/><text x="${mL - 8}" y="${y(v) + 4}" text-anchor="end">${v.toFixed(0)}</text></g>`; }
    categories.forEach((c, i) => {
      const x0 = mL + bw * i + bw * 0.15;
      series.forEach((s, si) => { const v = s.values[i]; if (!v) return; out += `<rect class="bar" x="${x0 + gw * si}" y="${y(v)}" width="${gw - 2}" height="${y(0) - y(v)}" fill="${s.color}" rx="1.5" data-tip="${U.esc(`${c} · ${s.label}: ${fmt(v)}`)}"/>`; });
      out += `<text class="label" x="${x0 + (gw * series.length) / 2}" y="${h - 26}" text-anchor="middle">${U.esc(c.split(' ')[0])}</text><text class="label" x="${x0 + (gw * series.length) / 2}" y="${h - 12}" text-anchor="middle">${U.esc(c.split(' ').slice(1).join(' '))}</text>`;
    });
    out += '</svg>';
    return out;
  }

  function legend(items) { return `<div class="legend">${items.map((i) => `<span><i style="background:${i.color}"></i>${U.esc(i.label)}</span>`).join('')}</div>`; }

  function bindTips(root) {
    root.querySelectorAll('[data-tip]').forEach((el) => {
      el.addEventListener('mouseenter', (e) => { const t = tipEl(); if (!t) return; t.textContent = el.getAttribute('data-tip'); t.style.display = 'block'; });
      el.addEventListener('mousemove', (e) => { const t = tipEl(); if (!t) return; t.style.left = Math.min(window.innerWidth - t.offsetWidth - 8, e.clientX + 12) + 'px'; t.style.top = (e.clientY - 34) + 'px'; });

    if (pct >= 40 || (r.suppressed)) return { k: 'Contributor', why: r.suppressed ? 'Strong per-snap history, availability-limited' : `${pct}th pct ${r.pos}` };

  const teamChip = (t, small) => `<span class="team-chip ${small ? 'sm' : ''}" style="--team:${t.color}"><i></i>${t.abbr}</span>`;

  const pcard = (p, { compact = false, action = 'player' } = {}) => `<button class="pcard2 ${p.status === 'inj' || p.status === 'ir' ? 'inj' : ''} ${compact ? 'compact' : ''}" data-action="${action}" data-id="${p.id}" aria-label="${esc(p.name)} details">

  const meter = (pct, verdict) => `<div class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Partner acceptance likelihood"><div class="meter-fill ${pct >= 75 ? 'ok' : pct >= 50 ? 'warn' : pct >= 25 ? 'low' : 'bad'}" style="width:${pct}%"></div><span class="meter-txt">${verdict} · ${pct}%</span></div>`;
  const needBar = (n) => `<div class="need-row"><span class="need-pos">${n.group.id}</span><div class="need-bar"><div class="need-fill ${urgCls(n.urgency)}" style="width:${n.score}%"></div></div><span class="need-score num">${n.score}</span><span class="tag ${urgCls(n.urgency)}">${n.urgency}</span><span class="need-why small muted">${esc(n.why.join(' · ') || 'Settled')}</span></div>`;
  const assetLabel = (a) => a.type === 'pick' ? `${a.year} R${a.round} <span class="muted small">#${a.overall}${a.orig && a.orig !== a.owner ? ` via ${a.orig}` : ''}${a.source && a.source !== 'Own' && a.orig === 'PHI' ? ` · ${esc(a.source.replace(/\s*\(.*$/, '').slice(0, 26))}` : ''}${a.prov === 'E' ? ' · proj.' : ''}</span>` : `<b>${esc(a.name)}</b> <span class="muted small">${a.pos} · ${a.age}${a.hit26 ? ` · ${fm(a.hit26)}` : ''}</span>`;

  }
  function onInput(a, id, el) {

  function navBadges(id) {

};

  /* ---------- franchise layer ---------- */
  const F = FranchiseUI({ getState: () => state, getComputed: () => computed, set: (m, o) => set(m, o), setModule: (id, o) => setModule(id, o), toast: (...a) => toast(...a), modal: (...a) => modal(...a), closeModal: () => closeModal(), render: () => render() });

  /* ---------- module views ---------- */
  const Views = {
    ...F.views,
    overview() {
      const y = computed.years; const d = computed.deadByYear; const dr = computed.draft;
      const kpi = (label, value, cls, delta) => `<div class="card kpi"><div class="kpi-label">${label}</div><div class="kpi-value ${cls || ''}">${value}</div><div class="kpi-delta">${delta || ''}</div></div>`;
      return `
      <div class="grid kpis" style="margin-bottom:16px">

        ${kpi('2027 projected space', U.fm(y[2027].space), y[2027].space < 0 ? 'neg' : y[2027].space < 20 ? 'warn' : 'pos', `Cap ${U.fm(y[2027].leagueCap, { digits: 0 })} + ${U.fm(y[2027].carryover)} carry`)}
        ${kpi('2028 projected space', U.fm(y[2028].space), y[2028].space < 0 ? 'neg' : y[2028].space < 20 ? 'warn' : 'pos', `Target ${U.fm(DATA.TARGET_SPACE_2028, { digits: 0 })} · ${U.fm(computed.calc2028.surplus, { plus: true })}`)}
        ${kpi('2026 dead money', U.fm(d[2026]), 'warn', `${U.fm(d[2027])} in 2027 · ${U.fm(d[2028])} in 2028`)}
        ${kpi('Draft picks owned', `${dr.totalOwned}`, '', `${dr.byYear[2028].day1} firsts in 2028 · ${dr.byYear[2027].count} picks in 2027`)}
      </div>
      <div class="grid sidebar-right">
        <div class="stack">
          <div class="card"><div class="card-head"><h2>Cap obligations vs available cap</h2><span class="sub">${DATA.SCENARIOS[state.scenario].label} · labels show projected space</span></div><div data-chart="projection">${ChartViews.projection()}</div></div>
          <div class="card"><div class="card-head"><h2>Year-by-year derivation</h2><span class="sub">$M · negative = savings</span></div>
            <div class="table-wrap"><table class="sticky-col"><thead><tr><th>Line</th>${DATA.YEARS.map((yr) => `<th class="num">${yr}</th>`).join('')}</tr></thead><tbody>
              ${[['League cap', 'leagueCap'], ['Carryover in', 'carryover'], ['Available', 'available']].map(([l, k]) => `<tr><td>${l}</td>${DATA.YEARS.map((yr) => `<td class="num">${U.fm(y[yr][k])}</td>`).join('')}</tr>`).join('')}

            </tbody><tfoot><tr><td>Total obligations</td>${DATA.YEARS.map((yr) => `<td class="num" data-bind="oblig${yr}">${U.fm(y[yr].obligations)}</td>`).join('')}</tr><tr><td>Projected space</td>${DATA.YEARS.map((yr) => `<td class="num ${y[yr].space < 0 ? 'neg' : 'pos'}" data-bind="space${yr}">${U.fm(y[yr].space)}</td>`).join('')}</tr></tfoot></table></div>
          </div>
        </div>
        <div class="stack">
          <div class="card"><div class="card-head"><h2>Alerts</h2><span class="sub">${computed.alerts.length} active</span></div><div class="alerts">${computed.alerts.map((a) => `<div class="alert ${a.level}"><div class="bar"></div><div><b>${U.esc(a.title)}</b><span>${U.esc(a.msg)}</span></div></div>`).join('')}</div></div>
          <div class="card"><div class="card-head"><h2>Dead money ledger</h2><span class="sub">2026–2028</span></div><div data-chart="deadMoney">${ChartViews.deadMoney()}</div></div>
          <div class="card tight"><div class="card-head"><h2>Thesis</h2></div><p class="small" style="margin:0;color:var(--text-2);line-height:1.6">Absorb ${U.fm(d[2026] + d[2027], { digits: 0 })} of dead money across 2026–27, thread 2028 with restructures and rookie replacements, then reset in 2029 when Johnson, Jurgens and Brown charges clear. The 2028 war chest (${dr.byYear[2028].day1} firsts, ${dr.byYear[2028].day2} Day 2 picks) replaces Mailata, Smith, Dickerson and Barkley on rookie deals.</p><div class="row" style="margin-top:10px"><button class="btn sm" data-action="module" data-id="calculator">Open 2028 calculator</button><button class="btn sm" data-action="module" data-id="draft">Draft board</button></div></div>
        </div>
      </div>`;
    },

    calculator() {
      const c = computed.calc2028;
      const rsSlider = (ct) => { const mx = Model.maxConvert(ct, 2028); const val = (state.restructures[ct.id] && state.restructures[ct.id][2028]) || 0; const eff = computed.restructureRows.find((r) => r.contract.id === ct.id && r.year === 2028); const n = Model.remainingYears(ct, 2028);
        return `<div class="control"><label for="rs_${ct.id}_2028">Restructure ${U.esc(ct.name)} <span class="muted small">(${ct.pos}, 2028 hit ${U.fm(ct.hits[2028])})</span></label><span class="val" data-bind="rs_${ct.id}_2028">${eff ? `${U.fm(eff.convert)} → saves ${U.fm(eff.savings)}` : 'No conversion'}</span><input id="rs_${ct.id}_2028" type="range" min="0" max="${mx}" step="0.1" value="${val}" data-action="restructure" data-id="${ct.id}" data-year="2028" aria-label="Restructure ${U.esc(ct.name)} 2028 conversion amount"><span class="hint">Convert up to ${U.fm(mx)} of base to bonus over ${n} years · saves ${((n - 1) / n * 100).toFixed(0)}¢ per $ in 2028, pushes the rest to 2029–${ct.voidThrough}</span></div>`; };
      const lever = (id, label, hint) => { const mx = Model.leverMax(id); return `<div class="control"><label for="${id}">${label}</label><span class="val" data-bind="lever_${id}">${U.fm(state.levers[id])}</span><input id="${id}" type="range" min="0" max="${mx}" step="0.5" value="${state.levers[id]}" data-action="lever" data-id="${id}" aria-label="${label}"><span class="hint">${hint}</span></div>`; };
      const pct = Model.clamp(c.total / DATA.TARGET_SPACE_2028 * 100, 0, 100);
      return `
      <div class="grid sidebar-right">
        <div class="stack">
          <div class="card"><div class="card-head"><h2>Restructure levers</h2><span class="sub">Base-to-bonus conversions in the 2028 league year</span></div>
            ${DATA.CONTRACTS.filter((ct) => ct.restructurable && Model.maxConvert(ct, 2028) > 0).map(rsSlider).join('')}
          </div>
          <div class="card"><div class="card-head"><h2>Structural levers</h2><span class="sub">Independent of individual contracts</span></div>
            ${lever('lv_ext', 'Extension cap smoothing', 'Lower first-year hits on Carter, N. Smith and DeJean via signing bonus. Half of this is deferred to 2029.')}
            ${lever('lv_rookie', 'Rookie-for-veteran replacement', 'Starter snaps moved from veteran deals to 2027–28 draft picks (RT, C, TE, RB).')}

            <hr class="sep"><div class="row between"><span class="small muted">Cuts and trades flow in from their own modules.</span><span class="row"><button class="btn sm" data-action="module" data-id="cuts">Cuts (${computed.cutRows.length})</button><button class="btn sm" data-action="module" data-id="trades">Trades (${computed.tradeRows.length})</button><button class="btn sm ghost" data-action="resetCalculator">Reset levers</button></span></div>

        </div>
        <div class="stack">
          <div class="card"><div class="kpi-label">Projected 2028 cap space</div><div class="big-number ${c.total < 0 ? 'neg' : c.total < DATA.TARGET_SPACE_2028 ? 'warn' : 'pos'}" data-bind="calcTotal">${U.fm(c.total)}</div>
            <div class="row between" style="margin:10px 0 6px"><span class="small muted">Progress to ${U.fm(DATA.TARGET_SPACE_2028, { digits: 0 })} operating target</span><span class="small num ${U.cls(c.surplus)}" data-bind="calcSurplus">${U.fm(c.surplus, { plus: true })}</span></div>
            <div class="progress ${c.total < 0 ? 'neg' : c.total >= DATA.TARGET_SPACE_2028 ? 'ok' : ''}"><div data-bind="calcProgress" style="width:${pct}%"></div></div>
            <hr class="sep">
            <div class="waterfall-row"><span class="lbl">Base 2028 space <span>scenario + extensions + carryover</span></span><span class="num" data-bind="calcBase">${U.fm(c.base)}</span></div>
            <div class="waterfall-row"><span class="lbl">Restructures</span><span class="num pos" data-bind="calcRestructures">${U.fm(c.restructures, { plus: true })}</span></div>
            <div class="waterfall-row"><span class="lbl">Structural levers</span><span class="num pos" data-bind="calcLevers">${U.fm(c.levers, { plus: true })}</span></div>
            <div class="waterfall-row"><span class="lbl">Cuts (2028 net)</span><span class="num" data-bind="calcCuts">${U.fm(c.cuts, { plus: true })}</span></div>
            <div class="waterfall-row"><span class="lbl">Trades (2028 net)</span><span class="num" data-bind="calcTrades">${U.fm(c.trades, { plus: true })}</span></div>

          </div>
          <div class="stats two">
            <div class="stat"><div class="stat-label">Pushed into 2029</div><div class="stat-value warn" data-bind="calcPushed">${U.fm(c.pushed2029)}</div><div class="stat-sub">Proration + deferred dead money</div></div>
            <div class="stat"><div class="stat-label">In-season buffer</div><div class="stat-value" data-bind="calcBuffer">${U.fm(c.buffer)}</div><div class="stat-sub">Held inside obligations</div></div>
            <div class="stat"><div class="stat-label">2029 space</div><div class="stat-value pos" data-bind="space2029">${U.fm(computed.years[2029].space)}</div><div class="stat-sub">After pushes</div></div>
            <div class="stat"><div class="stat-label">2027 space</div><div class="stat-value ${computed.years[2027].space < 0 ? 'neg' : ''}" data-bind="space2027">${U.fm(computed.years[2027].space)}</div><div class="stat-sub">Feeds 2028 carryover</div></div>

        </div>

    },

    roster() {
      const tab = state.ui.rosterTab; const tabs = [['contracts', 'Contracts'], ['restructure', 'Restructure planner'], ['extensions', 'Extensions & options'], ['voids', 'Void exposure'], ['dead', 'Dead money ledger']];
      let body = '';
      if (tab === 'contracts') {
        const key = state.ui.sortKey, dir = state.ui.sortDir;
        const rows = DATA.CONTRACTS.slice().sort((a, b) => { const va = sortVal(a, key), vb = sortVal(b, key); return (va > vb ? 1 : va < vb ? -1 : 0) * dir; });
        const th = (k, l, num = true) => `<th class="${num ? 'num' : ''}" data-sort="${k}" data-action="sort" aria-sort="${key === k ? (dir === 1 ? 'ascending' : 'descending') : 'none'}">${l}${key === k ? `<span class="sort-ind">${dir === 1 ? '▲' : '▼'}</span>` : ''}</th>`;
        body = `<div class="table-wrap"><table class="sticky-col"><thead><tr>${th('name', 'Player', false)}${th('pos', 'Pos', false)}${th('age', 'Age')}${DATA.YEARS.map((y) => th('hit' + y, String(y))).join('')}${th('end', 'Thru')}<th>Void</th><th>Core</th><th>Src</th></tr></thead><tbody>
          ${rows.map((c) => `<tr><td><b>${U.esc(c.name)}</b></td><td>${c.pos}</td><td class="num">${c.age}</td>${DATA.YEARS.map((y) => `<td class="num ${y > c.end && c.hits[y] ? 'muted' : ''}">${c.hits[y] ? U.fm(c.hits[y]) : (y > c.end ? '<span class="muted">UFA</span>' : '—')}</td>`).join('')}<td class="num">${c.end}</td><td>${c.voidThrough > c.end ? `<span class="tag">→${c.voidThrough}</span>` : '—'}</td><td>${c.core ? '<span class="tag hi">Core</span>' : ''}${c.option5 ? ' <span class="tag">5th-yr</span>' : ''}</td><td>${U.prov(c.prov)}</td></tr>`).join('')}
        </tbody><tfoot><tr><td>Listed total</td><td></td><td></td>${DATA.YEARS.map((y) => `<td class="num">${U.fm(rows.reduce((a, c) => a + (c.hits[y] || 0), 0))}</td>`).join('')}<td colspan="4"></td></tr></tfoot></table></div>
        <p class="small muted" style="margin:10px 0 0">Greyed values after the contract end year are void-year charges that hit if the player is not re-signed. Johnson and Jurgens are tracked in the dead money ledger.</p>`;
      } else if (tab === 'restructure') {
        body = `<p class="section-sub">Convert base salary to signing bonus. Savings land in the conversion year; proration spreads across the remaining contract and void years (max 5).</p>
        <div class="grid two">${[2027, 2028].map((yr) => `<div class="card tight"><div class="card-head"><h2>${yr} conversions</h2><span class="sub">Saves ${U.fm(computed.years[yr].lines.restructureSavings * -1)}</span></div>
          ${DATA.CONTRACTS.filter((ct) => ct.restructurable && Model.maxConvert(ct, yr) > 0).map((ct) => { const mx = Model.maxConvert(ct, yr); const val = (state.restructures[ct.id] && state.restructures[ct.id][yr]) || 0; const eff = computed.restructureRows.find((r) => r.contract.id === ct.id && r.year === yr);
            return `<div class="control"><label for="rs_${ct.id}_${yr}">${U.esc(ct.name)} <span class="muted small">${ct.pos} · base ≈ ${U.fm(ct.base[yr])}</span></label><span class="val" data-bind="rs_${ct.id}_${yr}">${eff ? `${U.fm(eff.convert)} → saves ${U.fm(eff.savings)}` : 'No conversion'}</span><input id="rs_${ct.id}_${yr}" type="range" min="0" max="${mx}" step="0.1" value="${val}" data-action="restructure" data-id="${ct.id}" data-year="${yr}" aria-label="${U.esc(ct.name)} ${yr} conversion"><span class="hint">${Model.remainingYears(ct, yr)} proration years${eff && eff.fromScenario ? ' · set by the ' + DATA.SCENARIOS[state.scenario].label + ' scenario floor' : ''}</span></div>`; }).join('')}
        </div>`).join('')}</div>
        ${computed.restructureRows.length ? `<div class="card tight" style="margin-top:16px"><div class="card-head"><h2>Proration schedule</h2></div><div class="table-wrap"><table><thead><tr><th>Player</th><th class="num">Year</th><th class="num">Converted</th><th class="num">Saves</th>${[2028, 2029, 2030].map((y) => `<th class="num">+${y}</th>`).join('')}</tr></thead><tbody>${computed.restructureRows.map((r) => `<tr><td>${U.esc(r.contract.name)}</td><td class="num">${r.year}</td><td class="num">${U.fm(r.convert)}</td><td class="num pos">${U.fm(r.savings)}</td>${[2028, 2029, 2030].map((y) => `<td class="num ${r.push[y] ? 'neg' : 'muted'}">${r.push[y] ? U.fm(r.push[y]) : '—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>` : `<div class="empty" style="margin-top:16px"><b>No restructures active</b>Drag a slider to model a conversion.</div>`}`;
      } else if (tab === 'extensions') {
        body = `<p class="section-sub">Toggle the deals you intend to do. Incremental cap impact versus the current contract flows into every year of the projection. Conservative scenario scales positive hits by ${Math.round(DATA.SCENARIOS.conservative.extScale * 100)}%; Aggressive by ${Math.round(DATA.SCENARIOS.aggressive.extScale * 100)}%.</p>
        <div class="table-wrap"><table><thead><tr><th></th><th>Player</th><th>Type</th><th class="num">APY</th>${[2027, 2028, 2029, 2030].map((y) => `<th class="num">${y} Δ</th>`).join('')}<th>Note</th><th>Src</th></tr></thead><tbody>
          ${DATA.EXTENSIONS.map((e) => `<tr class="${state.extensions[e.id] ? 'selected' : ''}"><td><label class="check"><input type="checkbox" data-action="extension" data-id="${e.id}" ${state.extensions[e.id] ? 'checked' : ''} aria-label="Include ${U.esc(e.name)} ${U.esc(e.type)}"></label></td><td><b>${U.esc(e.name)}</b> <span class="muted small">${e.pos}</span></td><td>${U.esc(e.type)}</td><td class="num">${U.fm(e.apy)}</td>${[2027, 2028, 2029, 2030].map((y) => `<td class="num ${e.hits[y] < 0 ? 'pos' : e.hits[y] > 0 ? '' : 'muted'}">${e.hits[y] ? U.fm(e.hits[y], { plus: true }) : '—'}</td>`).join('')}<td class="small muted">${U.esc(e.note)}</td><td>${U.prov(e.prov)}</td></tr>`).join('')}
        </tbody><tfoot><tr><td colspan="4">Active impact (scaled)</td>${[2027, 2028, 2029, 2030].map((y) => `<td class="num">${U.fm(computed.extByYear[y], { plus: true })}</td>`).join('')}<td colspan="2"></td></tr></tfoot></table></div>`;

      } else {
        body = `<div class="table-wrap"><table><thead><tr><th>Player</th><th>Reason</th><th class="num">2026</th><th class="num">2027</th><th class="num">2028</th><th class="num">Total</th><th>Src</th></tr></thead><tbody>
          ${DATA.DEAD_MONEY.map((d) => `<tr><td><b>${U.esc(d.name)}</b></td><td class="small muted">${U.esc(d.reason)}</td>${[2026, 2027, 2028].map((y) => `<td class="num ${d.hits[y] ? 'neg' : 'muted'}">${d.hits[y] ? U.fm(d.hits[y]) : '—'}</td>`).join('')}<td class="num">${U.fm([2026, 2027, 2028].reduce((a, y) => a + (d.hits[y] || 0), 0))}</td><td>${U.prov(d.prov)}</td></tr>`).join('')}
        </tbody><tfoot><tr><td colspan="2">Total dead money</td>${[2026, 2027, 2028].map((y) => `<td class="num">${U.fm(computed.deadByYear[y])}</td>`).join('')}<td class="num">${U.fm(computed.deadByYear[2026] + computed.deadByYear[2027] + computed.deadByYear[2028])}</td><td></td></tr></tfoot></table></div>
        <div data-chart="deadMoney" style="margin-top:16px">${ChartViews.deadMoney()}</div>`;
      }
      return `<div class="card"><div class="tabs" role="tablist">${tabs.map(([id, l]) => `<button role="tab" aria-selected="${tab === id}" data-action="rosterTab" data-id="${id}">${l}</button>`).join('')}</div>${body}</div>`;
    },

    cuts() {
      const c = computed; const net = -Object.values(c.cutByYear).reduce((a, v) => a + v, 0);
      const row = (cand) => { const st = state.cuts[cand.id]; const sep = Model.separationDelta(cand, st.timing); const ct = DATA.CONTRACTS.find((x) => x.id === cand.id.replace('cut_', ''));
        return `<tr class="${st.on ? 'selected' : ''}"><td><label class="check"><input type="checkbox" data-action="cutToggle" data-id="${cand.id}" ${st.on ? 'checked' : ''} aria-label="Cut ${U.esc(cand.name)}"></label></td><td><b>${U.esc(cand.name)}</b><div class="small muted">${cand.pos} · ${cand.age} in ${cand.year}</div></td><td class="num">${cand.year}</td><td class="num">${U.fm(cand.hit)}</td>
        <td><div class="toggle-group" role="group" aria-label="June 1 treatment for ${U.esc(cand.name)}"><button data-action="cutTiming" data-id="${cand.id}" data-val="pre" aria-pressed="${st.timing === 'pre'}">Pre-June 1</button><button data-action="cutTiming" data-id="${cand.id}" data-val="post" aria-pressed="${st.timing === 'post'}">Post-June 1</button></div></td>
        <td class="num ${sep.deadY > 0 ? 'neg' : 'muted'}">${U.fm(sep.deadY)}${sep.deadNext ? `<div class="small muted">+${U.fm(sep.deadNext)} in ${cand.year + 1}</div>` : ''}</td><td class="num ${U.cls(sep.savingsY)}">${U.fm(sep.savingsY, { plus: true })}</td><td class="small muted">${U.esc(cand.note)}${ct && ct.core ? ' · <span class="tag hi">Core</span>' : ''}</td><td>${U.prov(cand.prov)}</td></tr>`; };
      const groups = [[2026, 'In-season 2026 (expiring deals)'], [2027, '2027 offseason'], [2028, '2028 offseason']];
      return `
      <div class="grid kpis" style="margin-bottom:16px">
        <div class="card kpi"><div class="kpi-label">Players selected</div><div class="kpi-value" data-bind="cutCount">${c.cutRows.length}</div><div class="kpi-delta">of ${DATA.CUT_CANDIDATES.length} candidates</div></div>
        <div class="card kpi"><div class="kpi-label">Cap savings (decision year)</div><div class="kpi-value pos" data-bind="cutSavings">${U.fm(c.cutSavingsTotal)}</div><div class="kpi-delta">Hit minus dead money</div></div>
        <div class="card kpi"><div class="kpi-label">Dead money created</div><div class="kpi-value ${c.cutDeadTotal > 0 ? 'neg' : ''}" data-bind="cutDead">${U.fm(c.cutDeadTotal)}</div><div class="kpi-delta">Incl. next-year post-June 1 charges</div></div>
        <div class="card kpi"><div class="kpi-label">Net multi-year effect</div><div class="kpi-value ${U.cls(net)}" data-bind="cutNet">${U.fm(net)}</div><div class="kpi-delta">2026 <span data-bind="cut2026">${U.fm(-c.cutByYear[2026])}</span> · 2027 <span data-bind="cut2027">${U.fm(-c.cutByYear[2027])}</span> · 2028 <span data-bind="cut2028">${U.fm(-c.cutByYear[2028])}</span></div></div>
      </div>
      <div class="card"><div class="card-head"><h2>Candidates</h2><span class="row"><button class="btn sm" data-action="cutBulk" data-val="expiring">Select expiring 2026</button><button class="btn sm" data-action="cutBulk" data-val="post">All post-June 1</button><button class="btn sm ghost" data-action="cutBulk" data-val="none">Clear</button></span></div>
        ${groups.map(([yr, label]) => `<div class="qa-group" style="margin-top:14px">${label}</div><div class="table-wrap"><table><thead><tr><th></th><th>Player</th><th class="num">Year</th><th class="num">Cap hit</th><th>Treatment</th><th class="num">Dead money</th><th class="num">Savings</th><th>Note</th><th>Src</th></tr></thead><tbody>${DATA.CUT_CANDIDATES.filter((x) => x.year === yr).map(row).join('')}</tbody></table></div>`).join('')}
        <p class="small muted" style="margin:12px 0 0">Pre-June 1 accelerates all remaining proration into the decision year. Post-June 1 keeps that year's proration and pushes the remainder to the following year; relief is not usable until after June 1.</p>

    },

    trades() {
      const t = state.ui.trade; const draft = Model.tradeValuation({ playerId: t.playerId, timing: t.timing, picks: t.picks });
      const p = draft.player;
      return `
      <div class="grid sidebar-right">
        <div class="stack">
          <div class="card"><div class="card-head"><h2>Build a trade</h2><span class="sub">Cap and pick-value evaluation</span></div>
            <div class="grid two">
              <div class="field"><span>Player</span><select data-action="tradePlayer" aria-label="Trade player">${DATA.TRADE_PLAYERS.map((x) => `<option value="${x.id}" ${x.id === t.playerId ? 'selected' : ''}>${U.esc(x.name)} — ${x.pos}, ${x.age} (${x.year} hit ${U.fm(x.hit)})</option>`).join('')}</select></div>
              <div class="field"><span>Processing</span><div class="toggle-group" role="group" aria-label="Trade timing"><button data-action="tradeTiming" data-val="pre" aria-pressed="${t.timing === 'pre'}">Pre-June 1</button><button data-action="tradeTiming" data-val="post" aria-pressed="${t.timing === 'post'}">Post-June 1</button></div></div>
            </div>
            <div class="field" style="margin-top:14px"><span>Compensation received</span><div class="row">${DATA.PICK_VALUES.map((pv) => `<label class="check tag" style="padding:5px 9px"><input type="checkbox" data-action="tradePick" data-id="${pv.id}" ${t.picks.includes(pv.id) ? 'checked' : ''}> ${U.esc(pv.label)} <span class="muted">· ${pv.value}</span></label>`).join('')}</div></div>

              <div class="stat"><div class="stat-label">Dead money ${p.year + 1}</div><div class="stat-value ${draft.sep.deadNext ? 'neg' : ''}">${U.fm(draft.sep.deadNext)}</div><div class="stat-sub">${t.timing === 'post' ? 'Deferred proration' : 'None (accelerated)'}</div></div>
              <div class="stat"><div class="stat-label">Pick value</div><div class="stat-value">${draft.pickValue}</div><div class="stat-sub">vs ${p.marketValue} market · ${U.esc(draft.verdict)}</div></div>
              <div class="stat"><div class="stat-label">Pick $ equivalent</div><div class="stat-value pos">${U.fm(draft.dollarEq)}/yr</div><div class="stat-sub">Surplus value heuristic</div></div>
            </div>
            <div class="row between" style="margin-top:14px"><span class="small muted">Net score ${U.fm(draft.netScore, { plus: true })} = relief + pick $ − ½ deferred dead money${p.note ? ' · ' + U.esc(p.note) : ''}</span><button class="btn primary" data-action="tradeAdd" ${t.picks.length ? '' : 'disabled'}>Add to plan</button></div>
          </div>
          <div class="card"><div class="card-head"><h2>Trades in plan</h2><span class="sub">${computed.tradeRows.length} active · ${computed.pickValueTotal} pick points</span></div>
            ${computed.tradeRows.length ? `<div class="table-wrap"><table><thead><tr><th>Player</th><th>Timing</th><th>Picks</th><th class="num">Relief</th><th class="num">Dead next yr</th><th>Verdict</th><th></th></tr></thead><tbody>${computed.tradeRows.map((r) => `<tr><td><b>${U.esc(r.player.name)}</b> <span class="muted small">${r.player.year}</span></td><td>${r.trade.timing === 'pre' ? 'Pre-June 1' : 'Post-June 1'}</td><td class="small">${r.picks.map((x) => U.esc(x.label)).join(', ')}</td><td class="num ${U.cls(r.sep.savingsY)}">${U.fm(r.sep.savingsY, { plus: true })}</td><td class="num ${r.sep.deadNext ? 'neg' : 'muted'}">${U.fm(r.sep.deadNext)}</td><td><span class="tag ${r.ratio >= 0.9 ? 'hi' : r.ratio >= 0.6 ? 'med' : 'crit'}">${U.esc(r.verdict)}</span></td><td class="right"><button class="btn sm ghost" data-action="tradeRemove" data-id="${r.trade.id}" aria-label="Remove trade">Remove</button></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty"><b>No trades in plan</b>Build one above and add it. Relief flows into the projection and 2028 calculator.</div>`}
          </div>
        </div>
        <div class="stack">
          <div class="card tight"><div class="card-head"><h2>Cap effect by year</h2></div>${DATA.YEARS.map((y) => `<div class="waterfall-row"><span class="lbl">${y}</span><span class="num ${U.cls(-computed.tradeByYear[y])}">${U.fm(-computed.tradeByYear[y], { plus: true })}</span></div>`).join('')}</div>
          <div class="card tight"><div class="card-head"><h2>Reading the verdict</h2></div><p class="small" style="margin:0;color:var(--text-2);line-height:1.6">Pick values use a Jimmy Johnson-style scale with a late-first baseline of 620. Market value is what a comparable player has recently returned. A trade can be a cap win and a value loss at once; the plan should not do both for the same roster hole.</p></div>

    draft() {

      let body = '';
      if (tab === 'order' || tab === 'board') {
        body = F.draftExtra(tab);
      } else if (tab === 'capital') {
        body = `<div class="stats" style="margin-bottom:16px">${[2027, 2028, 2029].map((y) => `<div class="stat"><div class="stat-label">${y}</div><div class="stat-value">${d.byYear[y].count} picks</div><div class="stat-sub">${d.byYear[y].day1} first · ${d.byYear[y].day2} Day 2 · slot cost ${U.fm(d.byYear[y].slotCost)}</div></div>`).join('')}<div class="stat"><div class="stat-label">Total owned</div><div class="stat-value pos">${d.totalOwned}</div><div class="stat-sub">Through 2029</div></div></div>
        <div class="table-wrap"><table><thead><tr><th class="num">Year</th><th class="num">Round</th><th>Source</th><th>Status</th><th class="num">Yr-1 slot</th><th>Src</th></tr></thead><tbody>${DATA.DRAFT_PICKS.map((p) => `<tr class="${p.status === 'Traded' ? '' : ''}"><td class="num">${p.year}</td><td class="num">${p.round}</td><td class="${p.status === 'Traded' ? 'muted' : ''}">${U.esc(p.source)}</td><td><span class="tag ${p.status === 'Owned' ? 'hi' : p.status === 'Projected' ? 'med' : 'crit'}">${p.status}</span></td><td class="num ${p.status === 'Traded' ? 'muted' : ''}">${p.status === 'Traded' ? '—' : U.fm(DATA.ROOKIE_SLOT[p.round])}</td><td>${U.prov(p.prov)}</td></tr>`).join('')}</tbody></table></div>`;
      } else if (tab === 'prospects') {

        body = `<div class="row between" style="margin-bottom:14px"><div class="seg">${[2027, 2028].map((y) => `<button data-action="prospectYear" data-val="${y}" aria-pressed="${yr === y}">${y} class</button>`).join('')}</div><div class="field" style="flex-direction:row;align-items:center;gap:8px"><span>Position</span><select data-action="prospectPos" aria-label="Filter position">${positions.map((p) => `<option ${p === pos ? 'selected' : ''}>${p}</option>`).join('')}</select></div></div>
        ${list.length ? `<div class="cards">${list.map((p) => { const on = !!state.board[p.id]; const vet = DATA.VET_COST[p.pos] || DATA.VET_COST[p.pos.split('/')[0]] || 15; return `<div class="pcard ${on ? 'on' : ''}"><div class="row between"><span class="name">${U.esc(p.name)}</span><span class="grade">${p.grade}</span></div><div class="meta">${p.pos} · ${U.esc(p.school)} · Round ${p.round} projection</div><div class="need">Fills: ${U.esc(p.need)}</div><div class="foot"><span class="tag ${p.fit === 'High' ? 'hi' : p.fit === 'Med' ? 'med' : 'low'}">${p.fit} fit</span><span class="small muted">${U.fm(DATA.ROOKIE_SLOT[p.round])} vs ${U.fm(vet, { digits: 0 })} vet</span></div><button class="btn sm ${on ? '' : 'primary'}" data-action="boardToggle" data-id="${p.id}" aria-pressed="${on}">${on ? 'Remove target' : 'Target'}</button></div>`; }).join('')}</div>` : `<div class="empty"><b>No prospects match</b>Try another position.</div>`}
        <p class="small muted" style="margin:14px 0 0">Grades and round projections are scouting estimates (E). Refresh before the combine.</p>`;
      } else if (tab === 'needs') {
        body = `<div class="table-wrap"><table><thead><tr><th>Position</th><th>Why</th><th>Urgency</th><th class="num">Vet starter APY</th><th class="num">R1 rookie</th><th class="num">R2 rookie</th><th class="num">Savings (R1)</th></tr></thead><tbody>${DATA.NEEDS.map((n) => { const vet = DATA.VET_COST[n.pos] || 15; return `<tr><td><b>${n.pos}</b></td><td class="small muted">${U.esc(n.why)}</td><td><span class="tag ${n.urgency === 'Now' ? 'crit' : n.urgency === '2027' ? 'med' : ''}">${n.urgency}</span></td><td class="num">${U.fm(vet, { digits: 0 })}</td><td class="num">${U.fm(DATA.ROOKIE_SLOT[1])}</td><td class="num">${U.fm(DATA.ROOKIE_SLOT[2])}</td><td class="num pos">${U.fm(vet - DATA.ROOKIE_SLOT[1])}/yr</td></tr>`; }).join('')}</tbody></table></div>`;
      } else {
        const bbRows = d.bbTargets.length ? `<div class="qa-group" style="margin:${d.targets.length ? 16 : 0}px 0 8px">Big-board targets (${d.bbTargets.length})</div><div class="table-wrap"><table><thead><tr><th class="num">Rank</th><th>Prospect</th><th>Pos</th><th>School</th><th>Tier</th><th class="num">Slot cost</th><th></th></tr></thead><tbody>${d.bbTargets.map((b) => `<tr><td class="num">${b.rank}</td><td><b>${U.esc(b.name)}</b></td><td>${b.pos}</td><td>${U.esc(b.school)}</td><td><span class="tag">${b.tier}</span></td><td class="num">${U.fm(LEAGUE.SLOT_COST(b.rank))}</td><td class="right"><button class="btn sm ghost" data-action="boardToggle" data-id="${b.id}">Remove</button></td></tr>`).join('')}</tbody></table></div>` : '';
        body = (d.targets.length ? `<div class="stats" style="margin-bottom:16px"><div class="stat"><div class="stat-label">Targets</div><div class="stat-value">${d.targets.length}</div></div><div class="stat"><div class="stat-label">Annual savings vs vets</div><div class="stat-value pos">${U.fm(d.targetSavings)}</div><div class="stat-sub">If every target starts</div></div><div class="stat"><div class="stat-label">Picks needed</div><div class="stat-value">${d.targets.filter((t) => t.prospect.round === 1).length} R1 · ${d.targets.filter((t) => t.prospect.round === 2).length} R2</div><div class="stat-sub">Own ${d.byYear[2027].day1 + d.byYear[2028].day1} firsts 2027–28</div></div></div>
          <div class="table-wrap"><table><thead><tr><th>Prospect</th><th class="num">Class</th><th class="num">Round</th><th>Need</th><th class="num">Rookie</th><th class="num">Vet</th><th class="num">Savings</th><th></th></tr></thead><tbody>${d.targets.map((t) => `<tr><td><b>${U.esc(t.prospect.name)}</b> <span class="muted small">${t.prospect.pos} · ${U.esc(t.prospect.school)}</span></td><td class="num">${t.prospect.year}</td><td class="num">${t.prospect.round}</td><td class="small muted">${U.esc(t.prospect.need)}</td><td class="num">${U.fm(t.slotCost)}</td><td class="num">${U.fm(t.vetCost, { digits: 0 })}</td><td class="num pos">${U.fm(t.savings)}</td><td class="right"><button class="btn sm ghost" data-action="boardToggle" data-id="${t.prospect.id}">Remove</button></td></tr>`).join('')}</tbody></table></div>
          <div class="row" style="margin-top:12px"><button class="btn sm" data-action="exportTargetsCsv">Export targets CSV</button></div>` : `<div class="empty"><b>No targets yet</b>Open the prospect board and press Target on players that fit the 2027–28 windows.</div>`) + bbRows;
        if (!d.targets.length && d.bbTargets.length) body = bbRows;
      }
      return `<div class="card"><div class="tabs" role="tablist">${tabs.map(([id, l]) => `<button role="tab" aria-selected="${tab === id}" data-action="draftTab" data-id="${id}">${l}</button>`).join('')}</div>${body}</div>`;
    },

    montecarlo() {
      const m = state.mc; const r = mcResult;
      const ctl = (id, label, min, max, step, val, bind, hint) => `<div class="control"><label for="mc_${id}">${label}</label><span class="val" data-bind="${bind}">${val}</span><input id="mc_${id}" type="range" min="${min}" max="${max}" step="${step}" value="${m[id]}" data-action="mc" data-id="${id}" aria-label="${label}"><span class="hint">${hint}</span></div>`;
      return `
      <div class="grid sidebar-right">
        <div class="stack">
          <div class="card"><div class="card-head"><h2>Cap space distribution 2027–2030</h2><span class="sub">${r ? `${r.sims} runs · seed ${r.seed}` : 'Not yet run'}</span></div><div data-chart="mc">${ChartViews.mc()}</div></div>
          ${r ? `<div class="card"><div class="card-head"><h2>Percentiles</h2><span class="sub">$M</span></div><div class="table-wrap"><table><thead><tr><th class="num">Year</th><th class="num">P10</th><th class="num">P25</th><th class="num">P50</th><th class="num">P75</th><th class="num">P90</th><th class="num">P(≥ $${DATA.TARGET_SPACE_2028}M)</th><th class="num">P(&lt; $0)</th></tr></thead><tbody>${[2027, 2028, 2029, 2030].map((y) => { const b = r.bands[y]; return `<tr><td class="num"><b>${y}</b></td><td class="num ${U.cls(b.p10)}">${U.fm(b.p10)}</td><td class="num">${U.fm(b.p25)}</td><td class="num"><b>${U.fm(b.p50)}</b></td><td class="num">${U.fm(b.p75)}</td><td class="num">${U.fm(b.p90)}</td><td class="num ${b.probTarget >= 50 ? 'pos' : 'warn'}">${U.pct(b.probTarget, 0)}</td><td class="num ${b.probNegative > 10 ? 'neg' : ''}">${U.pct(b.probNegative, 0)}</td></tr>`; }).join('')}</tbody></table></div></div>` : ''}
        </div>
        <div class="stack">
          <div class="card"><div class="card-head"><h2>Parameters</h2></div>
            ${ctl('sims', 'Simulations', 50, 2000, 50, m.sims, 'mcSims', 'More runs tighten the percentile estimate.')}
            ${ctl('capVar', 'League cap variance', 0, 15, 0.5, `±${m.capVar}%`, 'mcCapVar', 'Std. dev. of annual cap growth around cap tracker projections.')}
            ${ctl('spendVar', 'Spending variance', 0, 25, 1, `±$${m.spendVar}M`, 'mcSpendVar', 'Std. dev. of roster/injury spend per year.')}
            <div class="control"><label for="mc_seed">Seed</label><span></span><input id="mc_seed" type="number" value="${m.seed}" data-action="mcSeed" aria-label="Random seed" style="grid-column:1/-1"><span class="hint">Same seed + same inputs = identical result (reproducible for review).</span></div>
            <div class="row" style="margin-top:14px"><button class="btn primary" data-action="mcRun">Run simulation</button><button class="btn ghost" data-action="mcReseed">New seed</button></div>
          </div>
          ${r ? `<div class="stats two"><div class="stat"><div class="stat-label">P(2028 ≥ target)</div><div class="stat-value ${r.bands[2028].probTarget >= 50 ? 'pos' : 'warn'}">${U.pct(r.bands[2028].probTarget, 0)}</div></div><div class="stat"><div class="stat-label">P(2028 over cap)</div><div class="stat-value ${r.bands[2028].probNegative > 10 ? 'neg' : ''}">${U.pct(r.bands[2028].probNegative, 0)}</div></div><div class="stat"><div class="stat-label">2028 median</div><div class="stat-value">${U.fm(r.bands[2028].p50)}</div></div><div class="stat"><div class="stat-label">2029 median</div><div class="stat-value pos">${U.fm(r.bands[2029].p50)}</div></div></div>` : ''}
          <div class="card tight"><div class="card-head"><h2>Method</h2></div><p class="small" style="margin:0;color:var(--text-2);line-height:1.6">Each run perturbs the league cap path (compounding, normal) and annual obligations (normal, independent) around the current plan, then rolls unused space forward. Results reflect the plan as currently configured, including restructures, cuts and trades.</p></div>
        </div>
      </div>`;
    },

      let body = '';

        body = `<div class="row between" style="margin-bottom:14px"><p class="section-sub" style="margin:0">Save the current plan under a name, reload it later, or export it as JSON for review.</p><span class="row"><button class="btn primary" data-action="saveScenario">Save current plan</button><button class="btn" data-action="exportJson">Export JSON</button><button class="btn" data-action="importJson">Import JSON</button></span></div>
        ${saved.length ? `<div class="stack">${saved.map((s) => `<div class="scenario-card"><div><div class="nm">${U.esc(s.name)}</div><div class="dt">${new Date(s.savedAt).toLocaleString()} · ${DATA.SCENARIOS[s.state.scenario] ? DATA.SCENARIOS[s.state.scenario].label : 'Base'} · 2028 ${U.fm(s.summary.space2028)}</div></div><div class="acts"><button class="btn sm" data-action="loadScenario" data-id="${s.id}">Load</button><button class="btn sm" data-action="duplicateScenario" data-id="${s.id}">Duplicate</button><button class="btn sm" data-action="exportScenarioFile" data-id="${s.id}">Export</button><button class="btn sm danger" data-action="deleteScenario" data-id="${s.id}">Delete</button></div></div>`).join('')}</div>` : `<div class="empty"><b>No saved scenarios</b>Press Save current plan (or ⌘S) to snapshot the levers, cuts, trades and targets.</div>`}`;
      } else if (tab === 'compare') {

          <tr><td>2028 vs target</td>${cols.map((c) => `<td class="num ${U.cls(c.c.calc2028.surplus)}">${U.fm(c.c.calc2028.surplus, { plus: true })}</td>`).join('')}</tr>
          <tr><td>Pushed to 2029</td>${cols.map((c) => `<td class="num">${U.fm(c.c.calc2028.pushed2029)}</td>`).join('')}</tr>
          <tr><td>Cuts / dead created</td>${cols.map((c) => `<td class="num">${c.c.cutRows.length} / ${U.fm(c.c.cutDeadTotal)}</td>`).join('')}</tr>
          <tr><td>Trades / pick pts</td>${cols.map((c) => `<td class="num">${c.c.tradeRows.length} / ${c.c.pickValueTotal}</td>`).join('')}</tr>
          <tr><td>Extensions on</td>${cols.map((c) => `<td class="num">${c.c.extRows.length}</td>`).join('')}</tr>
          <tr><td>Draft targets</td>${cols.map((c) => `<td class="num">${c.c.draft.targets.length}</td>`).join('')}</tr>
          <tr><td>Critical alerts</td>${cols.map((c) => `<td class="num ${c.c.alerts.some((a) => a.level === 'critical') ? 'neg' : 'pos'}">${c.c.alerts.filter((a) => a.level === 'critical').length}</td>`).join('')}</tr>
        </tbody></table></div>` : `<div class="empty"><b>Nothing to compare yet</b>Save at least one scenario to compare it against the current plan.</div>`;
      } else if (tab === 'assumptions') {
        const cu = state.custom; const isCustom = state.scenario === 'custom';
        body = `<p class="section-sub">These apply when the <b>Custom</b> scenario is selected. ${isCustom ? '' : `<button class="btn sm" data-action="scenario" data-id="custom">Switch to Custom</button>`}</p>
        <div class="grid two"><div>
          <div class="control"><label for="cu_cap">League cap growth vs projection</label><span class="val" data-bind="customCapGrowth">${(cu.capGrowth * 100).toFixed(1)}%</span><input id="cu_cap" type="range" min="-0.1" max="0.1" step="0.005" value="${cu.capGrowth}" data-action="custom" data-id="capGrowth" ${isCustom ? '' : 'disabled'} aria-label="Cap growth adjustment"><span class="hint">Compounds from 2027. −4% is the Conservative preset.</span></div>
          <div class="control"><label for="cu_ext">Extension cost scale</label><span class="val" data-bind="customExtScale">${Math.round(cu.extScale * 100)}%</span><input id="cu_ext" type="range" min="0.5" max="1.5" step="0.05" value="${cu.extScale}" data-action="custom" data-id="extScale" ${isCustom ? '' : 'disabled'} aria-label="Extension cost scale"><span class="hint">Scales positive extension hits.</span></div>
