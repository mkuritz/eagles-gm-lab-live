  function sortVal(c, key) { if (key.startsWith('hit')) return c.hits[Number(key.slice(3))] || 0; const v = c[key]; return typeof v === 'string' ? v.toLowerCase() : (v || 0); }

  /* ---------- modal ---------- */
  function modal(html, { onOpen } = {}) { const m = document.getElementById('modal'); document.getElementById('modalBox').innerHTML = html; m.classList.add('open'); document.body.style.overflow = 'hidden'; if (onOpen) onOpen(document.getElementById('modalBox')); const f = m.querySelector('input,button'); if (f) f.focus(); }
  function closeModal() { const m = document.getElementById('modal'); m.classList.remove('open'); document.body.style.overflow = ''; }
  function confirmModal(title, text, okLabel, onOk, danger = false) {
    modal(`<h3>${U.esc(title)}</h3><p>${U.esc(text)}</p><div class="actions"><button class="btn" data-action="closeModal">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="modalOk">${U.esc(okLabel)}</button></div>`, { onOpen: (box) => { box.querySelector('#modalOk').onclick = () => { closeModal(); onOk(); }; box.querySelector('#modalOk').focus(); } });
  }
  function promptModal(title, text, defaultVal, okLabel, onOk) {
    modal(`<h3>${U.esc(title)}</h3><p>${U.esc(text)}</p><input type="text" id="modalInput" value="${U.esc(defaultVal)}" maxlength="60" style="width:100%" aria-label="${U.esc(title)}"><div class="actions"><button class="btn" data-action="closeModal">Cancel</button><button class="btn primary" id="modalOk">${U.esc(okLabel)}</button></div>`, { onOpen: (box) => { const inp = box.querySelector('#modalInput'); const ok = () => { const v = inp.value.trim(); if (!v) { inp.focus(); return; } closeModal(); onOk(v); }; box.querySelector('#modalOk').onclick = ok; inp.onkeydown = (e) => { if (e.key === 'Enter') ok(); }; inp.focus(); inp.select(); } });
  }

  /* ---------- scenario management ---------- */
  function saveScenario(name) {
    const entry = { id: U.uid(), name, savedAt: new Date().toISOString(), state: Model.stripUi(state), summary: { space2028: computed.years[2028].space, space2027: computed.years[2027].space } };
    saved.unshift(entry); saved = saved.slice(0, 25);
    if (!Store.set(Store.SAVED_KEY, saved)) toast('Saved for this session only — browser storage unavailable', 'warn'); else toast(`Saved “${name}”`, 'ok');
    render(); return entry;
  }
  function loadScenario(id) { const s = saved.find((x) => x.id === id); if (!s) return toast('Scenario not found', 'error'); const ui = state.ui; state = Model.migrate({ ...s.state, ui }); recompute(); mcResult = null; render(); markDirty(); toast(`Loaded “${s.name}”`, 'ok'); }
  function deleteScenario(id) { saved = saved.filter((x) => x.id !== id); Store.set(Store.SAVED_KEY, saved); render(); toast('Scenario deleted'); }
  function exportJson(name) { const payload = Model.exportScenario(state, name || 'Current plan'); U.download(`eagles-gm-lab-${(name || 'plan').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(payload, null, 2)); toast('Scenario exported', 'ok'); }
  function importFromText(text) {
    let obj; try { obj = JSON.parse(text); } catch (e) { toast('Import failed: file is not valid JSON', 'error'); logError('Import parse failed', e); return false; }
    const v = Model.validateImport(obj); if (!v.ok) { toast('Import failed: ' + v.errors[0], 'error'); logError('Import validation failed: ' + v.errors.join(' | ')); return false; }
    const ui = state.ui; state = Model.migrate({ ...obj.state, ui }); recompute(); mcResult = null; render(); markDirty(); toast(`Imported “${obj.name || 'scenario'}”`, 'ok'); return true;
  }
  function resetAll() { state = Model.defaultState(); mcResult = null; recompute(); Store.remove(Store.KEY); render(); markDirty(); toast('Plan reset to defaults'); }

  function exportMemo() {
    const y = computed.years; const lines = [`# Eagles cap plan memo — ${new Date().toLocaleDateString()}`, '', `Scenario: ${DATA.SCENARIOS[state.scenario].label}. Snapshot ${DATA.SNAPSHOT}.`, '', '## Projected space', '', '| Year | Available | Obligations | Space |', '|---|---:|---:|---:|'].concat(DATA.YEARS.map((yr) => `| ${yr} | ${U.fm(y[yr].available)} | ${U.fm(y[yr].obligations)} | ${U.fm(y[yr].space)} |`));
    lines.push('', '## 2028 calculator', '', `Base ${U.fm(computed.calc2028.base)} · restructures ${U.fm(computed.calc2028.restructures, { plus: true })} · levers ${U.fm(computed.calc2028.levers, { plus: true })} · cuts ${U.fm(computed.calc2028.cuts, { plus: true })} · trades ${U.fm(computed.calc2028.trades, { plus: true })} → **${U.fm(computed.calc2028.total)}** (target ${U.fm(DATA.TARGET_SPACE_2028, { digits: 0 })}).`);
    if (computed.cutRows.length) lines.push('', '## Cuts', '', ...computed.cutRows.map((r) => `- ${r.cand.name} (${r.cand.year}, ${r.timing}-June 1): saves ${U.fm(r.savingsY)}, dead ${U.fm(r.deadY)}${r.deadNext ? ` + ${U.fm(r.deadNext)} next year` : ''}`));
    if (computed.tradeRows.length) lines.push('', '## Trades', '', ...computed.tradeRows.map((r) => `- ${r.player.name} for ${r.picks.map((p) => p.label).join(', ')}: relief ${U.fm(r.sep.savingsY)}, verdict ${r.verdict}`));
    if (computed.draft.targets.length) lines.push('', '## Draft targets', '', ...computed.draft.targets.map((t) => `- ${t.prospect.name}, ${t.prospect.pos}, ${t.prospect.school} (${t.prospect.year} R${t.prospect.round}) — saves ${U.fm(t.savings)}/yr vs veteran`));
    lines.push('', '## Alerts', '', ...computed.alerts.map((a) => `- [${a.level}] ${a.title}: ${a.msg}`));
    if (state.notes) lines.push('', '## Notes', '', state.notes);
    lines.push('', '---', 'Sources: ' + DATA.SOURCES.map((s) => `${s.label} <${s.url}>`).join('; '));
    U.download(`eagles-cap-memo-${new Date().toISOString().slice(0, 10)}.md`, lines.join('\n'), 'text/markdown'); toast('Memo exported', 'ok');
  }
  function exportCsv(which) {
    let rows = [];
    if (which === 'contracts') rows = [['Player', 'Pos', 'Age', ...DATA.YEARS, 'Thru', 'VoidThrough', 'Prov']].concat(DATA.CONTRACTS.map((c) => [c.name, c.pos, c.age, ...DATA.YEARS.map((y) => c.hits[y] || 0), c.end, c.voidThrough, c.prov]));
    else if (which === 'dead') rows = [['Player', 'Reason', 2026, 2027, 2028, 'Prov']].concat(DATA.DEAD_MONEY.map((d) => [d.name, d.reason, d.hits[2026] || 0, d.hits[2027] || 0, d.hits[2028] || 0, d.prov]));
    else if (which === 'projection') rows = [['Year', 'LeagueCap', 'Carryover', 'Available', ...Object.keys(computed.years[2026].lines), 'Obligations', 'Space']].concat(DATA.YEARS.map((y) => { const r = computed.years[y]; return [y, r.leagueCap, r.carryover, r.available, ...Object.values(r.lines), r.obligations, r.space]; }));
    else if (which === 'picks') rows = [['Year', 'Round', 'Source', 'Status', 'Prov']].concat(DATA.DRAFT_PICKS.map((p) => [p.year, p.round, p.source, p.status, p.prov]));
    else if (which === 'targets') rows = [['Prospect', 'Pos', 'School', 'Class', 'Round', 'Grade', 'Need', 'RookieCost', 'VetCost', 'Savings']].concat(computed.draft.targets.map((t) => [t.prospect.name, t.prospect.pos, t.prospect.school, t.prospect.year, t.prospect.round, t.prospect.grade, t.prospect.need, t.slotCost, t.vetCost, t.savings]));
    U.download(`eagles-${which}.csv`, U.csv(rows), 'text/csv'); toast('CSV exported', 'ok');
  }

  /* ---------- events ---------- */
  function onAction(e) {
    const el = e.target.closest('[data-action]'); if (!el) return;
    const a = el.getAttribute('data-action'), id = el.getAttribute('data-id'), val = el.getAttribute('data-val');
    const type = e.type;
    // input-type events
    if (type === 'input') {
      if (a === 'restructure') { const yr = Number(el.getAttribute('data-year')); const ct = DATA.CONTRACTS.find((c) => c.id === id); const v = Model.clamp(Number(el.value), 0, Model.maxConvert(ct, yr)); set((s) => { s.restructures[id] = s.restructures[id] || {}; s.restructures[id][yr] = v; }, { live: true }); }
      else if (a === 'lever') set((s) => { s.levers[id] = Model.clamp(Number(el.value), 0, Model.leverMax(id)); }, { live: true });
      else if (a === 'mc') set((s) => { s.mc[id] = Number(el.value); }, { live: true });
      else if (a === 'custom') set((s) => { s.custom[id] = Number(el.value); }, { live: true });
      else if (a === 'notes') { state.notes = el.value.slice(0, 5000); markDirty(); }
      else F.onInput(a, id, el);
      return;
    }
    if (type === 'change') {
      if (F.onChange(a, id, el)) return;
      if (a === 'restructure' || a === 'lever' || a === 'custom') { render(); return; }
      if (a === 'mc') { render(); return; }
      if (a === 'mcSeed') { set((s) => { s.mc.seed = Math.round(Number(el.value)) || 42; }); return; }
      if (a === 'extension') { set((s) => { s.extensions[id] = el.checked; }); return; }
      if (a === 'cutToggle') { set((s) => { s.cuts[id].on = el.checked; }); return; }
      if (a === 'tradePlayer') { set((s) => { s.ui.trade.playerId = el.value; }); return; }
      if (a === 'tradePick') { set((s) => { const p = s.ui.trade.picks; if (el.checked) { if (!p.includes(id)) p.push(id); } else s.ui.trade.picks = p.filter((x) => x !== id); }); return; }
      if (a === 'prospectPos') { set((s) => { s.ui.prospectPos = el.value; }); return; }
      if (a === 'customToggle') { set((s) => { s.custom[id] = el.checked; }); return; }
      if (a === 'scenarioSelect') { set((s) => { s.scenario = el.value; }); return; }
      return;
    }
    if (type !== 'click') return;
    if (el.tagName === 'A') e.preventDefault();
    const actions = {
      module: () => setModule(id),
      toggleSidebar: () => document.body.classList.toggle('sidebar-open'),
      closeSidebar: () => document.body.classList.remove('sidebar-open'),
      closeModal, shortcuts: showShortcuts,
      scenario: () => set((s) => { s.scenario = id; }),
      rosterTab: () => set((s) => { s.ui.rosterTab = id; }),
      draftTab: () => set((s) => { s.ui.draftTab = id; }),
      scenarioTab: () => set((s) => { s.ui.scenarioTab = id; }),
      sort: () => set((s) => { const k = el.getAttribute('data-sort'); if (s.ui.sortKey === k) s.ui.sortDir *= -1; else { s.ui.sortKey = k; s.ui.sortDir = k === 'name' || k === 'pos' ? 1 : -1; } }),
      cutTiming: () => set((s) => { s.cuts[id].timing = val; }),
      cutBulk: () => set((s) => { DATA.CUT_CANDIDATES.forEach((c) => { if (val === 'none') s.cuts[c.id].on = false; else if (val === 'expiring') { if (c.year === 2026) s.cuts[c.id].on = true; } else if (val === 'post') { s.cuts[c.id].timing = 'post'; } }); }),
      tradeTiming: () => set((s) => { s.ui.trade.timing = val; }),
      tradeAdd: () => { if (!state.ui.trade.picks.length) return toast('Pick at least one compensation item', 'warn'); set((s) => { s.trades.push({ id: U.uid(), playerId: s.ui.trade.playerId, timing: s.ui.trade.timing, picks: s.ui.trade.picks.slice() }); }); toast('Trade added to plan', 'ok'); },
      tradeRemove: () => set((s) => { s.trades = s.trades.filter((t) => t.id !== id); }),
      prospectYear: () => set((s) => { s.ui.prospectYear = Number(val); s.ui.prospectPos = 'All'; }),
      boardToggle: () => set((s) => { if (s.board[id]) delete s.board[id]; else s.board[id] = true; }),
      exportTargetsCsv: () => exportCsv('targets'),
      mcRun: runMonteCarlo,
      mcReseed: () => { set((s) => { s.mc.seed = Math.floor(Math.random() * 1e6); }); runMonteCarlo(); },
      resetCalculator: () => set((s) => { DATA.CONTRACTS.forEach((c) => { if (s.restructures[c.id]) delete s.restructures[c.id][2028]; }); Object.keys(s.levers).forEach((k) => { s.levers[k] = 0; }); }),
      saveScenario: () => promptModal('Save scenario', 'Name this plan so you can reload or compare it later.', `${DATA.SCENARIOS[state.scenario].label} plan ${new Date().toLocaleDateString()}`, 'Save', saveScenario),
      loadScenario: () => loadScenario(id),

    t('No horizontal page overflow at current viewport', () => { App.setModule('overview'); assert(document.documentElement.scrollWidth <= window.innerWidth + 1, `scrollWidth ${document.documentElement.scrollWidth} > ${window.innerWidth}`); assert($('#main').scrollWidth <= $('#main').clientWidth + 1, 'main overflow'); });
    t('Every range input and icon-only button has an accessible name', () => { App.MODULES.forEach((m) => { App.setModule(m.id); $$('input[type=range]').forEach((i) => assert(i.getAttribute('aria-label') || $(`label[for="${i.id}"]`), `range ${i.id} unlabeled in ${m.id}`)); $$('button').forEach((b) => assert(b.textContent.trim() || b.getAttribute('aria-label'), `unnamed button in ${m.id}`)); }); });
    t('Tables use header cells and tabs expose selection state', () => { App.setModule('roster'); assert($$('#main thead th').length > 5, 'headers'); assert($$('[role="tab"][aria-selected="true"]').length === 1, 'one selected tab'); });
    t('Hash routing restores a module on hashchange', async () => { location.hash = 'draft'; await sleep(30); eq(App.getState().ui.module, 'draft', 'routed'); });
  });

  /* ---------------- Franchise layer ---------------- */
  group('Franchise — data integrity', (t) => {
    t('32 teams, 8 divisions of 4, PHI present with Tankathon slot #16', () => { eq(LEAGUE.TEAMS.length, 32, 'teams'); const divs = {}; LEAGUE.TEAMS.forEach((x) => { const k = x.conf + x.div; divs[k] = (divs[k] || 0) + 1; }); eq(Object.keys(divs).length, 8, 'divisions'); assert(Object.values(divs).every((n) => n === 4), '4 per division'); eq(Franchise.team('PHI').pick27, 16, 'slot'); });
    t('Draft order slots are a permutation of 1–32', () => { const slots = LEAGUE.TEAMS.map((x) => x.pick27).sort((a, b) => a - b); eq(slots.join(','), Array.from({ length: 32 }, (_, i) => i + 1).join(','), 'slots'); });
    t('Active roster is exactly 53 with one IR player and every player mapped to a position group', () => { const r = LEAGUE.ROSTER; eq(r.filter((p) => p.status !== 'ir').length, 53, 'active'); eq(r.filter((p) => p.status === 'ir').length, 1, 'IR'); assert(r.every((p) => LEAGUE.GROUPS.some((g) => g.id === p.grp)), 'groups'); eq(new Set(r.map((p) => p.id)).size, r.length, 'unique ids'); });
    t('Roster contract links resolve and departed players are absent', () => { LEAGUE.ROSTER.filter((p) => p.contractId).forEach((p) => assert(DATA.CONTRACTS.some((c) => c.id === p.contractId), `${p.name} contract`)); assert(!LEAGUE.ROSTER.some((p) => /Jurgens|Lane Johnson|A\.J\. Brown/.test(p.name)), 'departed gone'); assert(LEAGUE.ROSTER.find((p) => p.id === 'fjohnson').depth === 2 && LEAGUE.ROSTER.find((p) => p.id === 'fjohnson').grp === 'OT', 'Fred Johnson is the RT'); });
    t('Big board has 94 ranked prospects in order; trade block and FA market are populated', () => { eq(LEAGUE.BIG_BOARD_2027.length, 94, 'board'); LEAGUE.BIG_BOARD_2027.forEach((b, i) => eq(b.rank, i + 1, 'rank order')); assert(LEAGUE.TRADE_BLOCK.length >= 40, 'block'); assert(LEAGUE.FA_MARKET_2027.length >= 50, 'FA'); assert(LEAGUE.TRADE_BLOCK.every((b) => LEAGUE.TEAMS.some((x) => x.abbr === b.team)), 'block teams valid'); });
  });

  group('Franchise — valuation, depth & needs', (t) => {
    t('Market tier is bounded 50–99, labelled contract-based, and ranks Hurts above Dalton', () => { const r = Franchise.roster(Model.defaultState()); assert(r.every((p) => p.mkt >= 50 && p.mkt <= 99), 'bounds'); const h = r.find((p) => p.id === 'hurts').mkt, d = r.find((p) => p.id === 'dalton').mkt; assert(h > d, `Hurts ${h} > Dalton ${d}`); });
    t('Pick chart is monotone decreasing and discounts future years 15%/yr', () => { let prev = Infinity; for (let o = 1; o <= 256; o += 5) { const v = Franchise.pickValue(o); assert(v <= prev, `pick ${o}`); prev = v; } eq(Franchise.pickValue(1), 3000, '#1'); eq(Franchise.pickValue(16), 1000, '#16'); near(Franchise.pickValue(16, 2028), 850, '2028 discount', 1); });
    t('Player trade value rewards youth and control: Carter > Baun; injured players discounted', () => { const s = Model.defaultState(); const r = Franchise.roster(s); const v = (id) => r.find((p) => p.id === id).value; assert(v('carter') > v('baun'), 'Carter > Baun'); const g = LEAGUE.ROSTER.find((p) => p.id === 'greenard'); const healthy = Franchise.playerTradeValue({ ...g, status: 'active' }); assert(Franchise.playerTradeValue(g) < healthy, 'injury discount'); });
    t('Depth chart covers all 12 groups and fills starters in depth order', () => { const dc = Franchise.depthChart(Model.defaultState()); eq(dc.length, 12, 'groups'); const qb = dc.find((d) => d.group.id === 'QB'); eq(qb.starters[0].id, 'hurts', 'QB1'); const ot = dc.find((d) => d.group.id === 'OT'); eq(ot.starters.map((p) => p.id).join(','), 'mailata,fjohnson', 'tackles'); });
    t('Needs: OT is critical after Johnson retired; LB is settled; scores bounded 0–100', () => { const ns = Franchise.needs(Model.defaultState()); const ot = ns.find((n) => n.group.id === 'OT'); eq(ot.urgency, 'Critical', 'OT critical'); const lb = ns.find((n) => n.group.id === 'LB'); eq(lb.urgency, 'Low', 'LB low'); assert(ns.every((n) => n.score >= 0 && n.score <= 100), 'bounds'); assert(ns[0].score >= ns[ns.length - 1].score, 'sorted'); });
    t('Re-signing an expiring starter lowers that group\'s need score', () => { const s = Model.defaultState(); const before = Franchise.needScoreFor(s, 'CB'); s.resigns.woolen = { on: true, years: 3, apy: 14 }; const after = Franchise.needScoreFor(s, 'CB'); assert(after < before, `${after} < ${before}`); });
    t('Pending FA list equals players with contracts ending 2026 and carries market estimates', () => { const s = Model.defaultState(); const fa = Franchise.pendingFA(s); eq(fa.length, LEAGUE.ROSTER.filter((p) => p.thru <= 2026).length, 'count'); assert(fa.every((f) => f.market >= 1.2), 'market'); assert(fa[0].market >= fa[fa.length - 1].market, 'sorted by market'); });
  });

  group('Franchise — trade machine & cap integration', (t) => {
    const trade = () => ({ partner: 'TEN', give: [{ type: 'player', side: 'PHI', id: 'goedert' }, { type: 'pick', id: 'dp_0' }], get: [{ type: 'player', id: 'dmoore' }] });
    t('Two-sided evaluation returns values, acceptance 0–99 and a verdict', () => { const ev = Franchise.evaluateTrade(trade(), Model.defaultState()); assert(ev.giveValue > 0 && ev.getValue > 0, 'values'); assert(ev.accept >= 0 && ev.accept <= 99, 'accept'); assert(['Accept', 'Likely', 'Counter', 'Reject'].includes(ev.verdict), 'verdict'); eq(ev.status, 'Seller', 'TEN 0-4 is a seller'); });
    t('Adding value to the Eagles side raises partner acceptance; empty side is Incomplete', () => { const s = Model.defaultState(); const lo = Franchise.evaluateTrade({ partner: 'TEN', give: [{ type: 'player', side: 'PHI', id: 'goedert' }], get: [{ type: 'player', id: 'dmoore' }] }, s); const hi = Franchise.evaluateTrade(trade(), s); assert(hi.accept > lo.accept, `${hi.accept} > ${lo.accept}`); eq(Franchise.evaluateTrade({ partner: 'TEN', give: [], get: [] }, s).verdict, 'Incomplete', 'incomplete'); });
    t('In-season send effect: 2026 saves remaining base, 2027 absorbs future proration, later hits vanish', () => { const g = LEAGUE.ROSTER.find((p) => p.id === 'baun'); const e = Franchise.sendEffect(g); near(e.delta[2026], -Math.round(g.base26 * LEAGUE.GAMES_LEFT_FRACTION * 10) / 10, '2026', 0.05); assert(e.delta[2027] > 0, '2027 dead > remaining hit'); near(e.delta[2028], -DATA.CONTRACTS.find((c) => c.id === 'baun').hits[2028], '2028 hit removed', 0.06); });
    t('Executed trade flows into cap lines, roster, depth chart and draft capital', () => { const s = Model.defaultState(); const base = Model.compute(s); s.fmTrades.push({ id: 'qa1', ...trade() }); const c = Model.compute(s); assert(Math.abs(c.fmTradeByYear[2026]) > 0, 'cap line'); near(c.years[2026].space, base.years[2026].space - c.fmTradeByYear[2026], 'space moves by trade delta', 0.01); const r = Franchise.roster(s); assert(r.some((p) => p.id === 'dmoore') && !r.some((p) => p.id === 'goedert'), 'roster swap'); eq(c.draft.byYear[2027].count, base.draft.byYear[2027].count - 1, 'R1 gone'); eq(c.draft.tradedAway, 1, 'traded count'); });
    t('Receiving picks adds them to draft capital and partner picks respect traded firsts', () => { const s = Model.defaultState(); s.fmTrades.push({ id: 'qa2', partner: 'TEN', give: [{ type: 'player', side: 'PHI', id: 'baun' }], get: [{ type: 'pick', id: 'pk_TEN_2027_2', team: 'TEN' }] }); const c = Model.compute(s); eq(c.draft.received, 1, 'received'); assert(c.draft.owned.some((p) => /From TEN/.test(p.source)), 'source'); assert(!Franchise.partnerPicks('IND').some((p) => p.round === 1 && p.year === 2027), 'IND 2027 R1 belongs to NYJ'); eq(Franchise.partnerPicks('NYJ').filter((p) => p.round === 1 && p.year === 2027).length, 3, 'NYJ holds three firsts'); });
    t('Re-sign lines add APY above the minimum slot for the chosen years', () => { const s = Model.defaultState(); s.resigns.woolen = { on: true, years: 3, apy: 14 }; const c = Model.compute(s); near(c.resignByYear[2027], 12.8, '2027', 0.001); near(c.resignByYear[2029], 12.8, '2029', 0.001); eq(c.resignByYear[2030], 0, '2030 none'); near(c.years[2027].lines.resigns, 12.8, 'line', 0.001); });
    t('Migration validates trade-machine assets, partners and re-sign bounds', () => { const m = Model.migrate({ ui: { tm: { partner: 'ZZZ', give: [{ type: 'pick', id: 'dp_1' }, { type: 'bad' }] } }, resigns: { woolen: { on: true, years: 9, apy: 14 }, nope: {} }, fmTrades: [{ partner: 'TEN', give: [], get: [{ type: 'player', id: 'dmoore' }, { type: 'player', id: 'ghost' }] }, { partner: 'XXX' }], board: { bb_8: true, junk: true } }); eq(m.ui.tm.partner, 'TEN', 'partner reset'); eq(m.ui.tm.give.length, 1, 'bad asset dropped'); eq(m.resigns.woolen.years, 5, 'years clamped'); assert(!m.resigns.nope, 'unknown player dropped'); eq(m.fmTrades.length, 1, 'bad trade dropped'); eq(m.fmTrades[0].get.length, 1, 'ghost asset dropped'); eq(Object.keys(m.board).join(), 'bb_8', 'big-board target kept, junk dropped'); eq(m.version, 4, 'schema v4'); });
  });

  group('Franchise — UI flows', (t) => {
    t('Hub renders hero, six tiles, needs and inbox bound to computed values', () => { App.setModule('hub'); eq($$('.tile').length, 6, 'tiles'); assert($('.fm-team'), 'hero'); eq(text('[data-bind="space2026"]'), U.fm(App.getComputed().years[2026].space), 'space bind'); eq($$('.need-row').length, 12, 'needs'); assert($$('.alert').length >= 1, 'alerts'); });
    t('Tiles navigate to their modules', () => { App.setModule('hub'); click($('.tile[data-id="trademachine"]')); eq(App.getState().ui.module, 'trademachine', 'routed'); });
    t('Depth chart: side tabs switch and a player card opens the player modal with contract table', () => { App.setModule('depth'); click($('[data-action="depthSide"][data-val="DEF"]')); assert(text('.main').includes('Edge rusher'), 'defense shown'); click($('.pcard2[data-id="carter"]')); assert($('#modal').classList.contains('open'), 'modal open'); assert($('#modalBox').innerText.includes('Jalen Carter') && $('#modalBox').innerText.includes('Cap hit'), 'content'); App.closeModal(); });
    t('Trade machine: add assets, meter updates, execute, undo', async () => { App.setModule('trademachine'); App.set((s) => { s.ui.tm = { partner: 'TEN', give: [], get: [], filter: '', pfilter: '' }; s.fmTrades = []; }); click($('[data-action="tmAdd"][data-side="give"][data-id="goedert"]')); click($('[data-action="tmAdd"][data-side="give"][data-id="dp_0"]')); click($('[data-action="tmAdd"][data-side="get"][data-id="dmoore"]')); assert($('.meter-txt').textContent.includes('%'), 'meter'); const ev = Franchise.evaluateTrade({ partner: 'TEN', give: App.getState().ui.tm.give, get: App.getState().ui.tm.get }, App.getState()); assert(ev.verdict !== 'Reject' && ev.verdict !== 'Incomplete', 'executable'); click($('[data-action="tmExecute"]')); eq(App.getState().fmTrades.length, 1, 'executed'); eq(App.getState().ui.tm.give.length, 0, 'cleared'); click($('[data-action="tmUndo"]')); eq(App.getState().fmTrades.length, 0, 'undone'); });
    t('Trade machine rejects an incomplete or lopsided execute with a warning, not a crash', () => { App.setModule('trademachine'); App.set((s) => { s.ui.tm = { partner: 'TEN', give: [{ type: 'player', side: 'PHI', id: 'covey' }], get: [{ type: 'player', id: 'dmoore' }], filter: '', pfilter: '' }; }); const before = App.getState().fmTrades.length; click($('[data-action="tmExecute"]') || $('.tm-center')); eq(App.getState().fmTrades.length, before, 'not executed'); assert($('[data-action="tmExecute"]').disabled, 'button disabled'); });
    t('Partner select re-renders block and picks; League “Trade” button opens that partner', () => { App.setModule('trademachine'); const sel = $('select[data-action="tmPartner"]'); fire(sel, 'change', { value: 'ARI' }); eq(App.getState().ui.tm.partner, 'ARI', 'partner'); assert(text('.main').includes('Marvin Harrison'), 'ARI block'); App.setModule('league'); click($('[data-action="leagueView"][data-val="cap"]')); click($('[data-action="tmPartnerGo"][data-id="MIA"]')); eq(App.getState().ui.module, 'trademachine', 'routed'); eq(App.getState().ui.tm.partner, 'MIA', 'MIA selected'); });
    t('Free agency: toggle re-sign, change years and APY; budget tab totals match model', () => { App.setModule('freeagency'); App.set((s) => { s.resigns = {}; s.ui.faTab = 'pending'; }); fire($('input[data-action="faToggle"][data-id="woolen"]'), 'change', { checked: true }); assert(App.getState().resigns.woolen.on, 'on'); fire($('select[data-action="faYears"][data-id="woolen"]'), 'change', { value: '3' }); eq(App.getState().resigns.woolen.years, 3, 'years'); const r = $('input[data-action="faApy"][data-id="woolen"]'); fire(r, 'input', { value: '16' }); eq(App.getState().resigns.woolen.apy, 16, 'apy'); eq(text('[data-bind="fa_apy_woolen"]'), U.fm(16), 'live label'); click($('[data-action="faTab"][data-id="budget"]')); assert(text('.main').includes(U.fm(App.getComputed().resignByYear[2027])), 'budget total'); });
    t('Free agency market filters by position and offers trade shortcut for blocked players', () => { App.setModule('freeagency'); App.set((s) => { s.ui.faTab = 'market'; s.ui.faPos = 'All'; }); fire($('select[data-action="faPos"]'), 'change', { value: 'TE' }); eq(App.getState().ui.faPos, 'TE', 'filter'); assert(text('.main').includes('Hockenson'), 'TE market'); click($('[data-action="tmTarget"][data-id="hockenson"]')); eq(App.getState().ui.module, 'trademachine', 'routed'); eq(App.getState().ui.tm.partner, 'MIN', 'MIN'); eq(App.getState().ui.tm.get[0].id, 'hockenson', 'target staged'); });
    t('Draft Central: order tab highlights PHI at #16; big board target toggles and shows in My targets', () => { App.setModule('draft'); App.set((s) => { s.ui.draftTab = 'order'; s.board = {}; }); assert($('tr.selected') && $('tr.selected').innerText.includes('16'), 'PHI row'); click($('[data-action="draftTab"][data-id="board"]')); click($('[data-action="boardToggle"][data-id="bb_8"]')); assert(App.getState().board.bb_8, 'targeted'); click($('[data-action="draftTab"][data-id="targets"]')); assert(text('.main').includes('Trevor Goosby'), 'in targets'); });
    t('League standings render 8 divisions; cap table sorts by 2027 space', () => { App.setModule('league'); App.set((s) => { s.ui.leagueView = 'standings'; }); eq($$('.div-grid .card').length, 8, 'divisions'); click($('[data-action="leagueView"][data-val="cap"]')); click($('th[data-action="leagueSort"][data-id="space27"]')); const first = $('tbody tr td').innerText; assert(first.includes('ARI'), `ARI has most 2027 space, got ${first}`); });
    t('Export JSON round-trips trade machine and re-sign state', () => { App.set((s) => { s.fmTrades = [{ id: 'rt', partner: 'TEN', give: [{ type: 'pick', id: 'dp_1' }], get: [{ type: 'player', id: 'pollard' }] }]; s.resigns.steen = { on: true, years: 2, apy: 6 }; }); const payload = Model.exportScenario(App.getState(), 'rt'); const m = Model.migrate(payload.state); eq(m.fmTrades.length, 1, 'trade'); eq(m.resigns.steen.apy, 6, 'resign'); });
  });

  /* ---------------- runner ---------------- */
  async function run(App) {
    const t0 = performance.now();
    const savedState = JSON.parse(JSON.stringify(App.getState()));
    const savedScenarios = JSON.parse(JSON.stringify(App.getSaved()));
    const savedHash = location.hash;
    window.__QA_RUNNING = true;
    const out = [];
    for (const g of groups) {
      const tests = []; g.fn(makeT(tests));
      const results = [];
      for (const tc of tests) {
        const s = performance.now(); let pass = true, error = '';
        try { await tc.fn(); } catch (e) { pass = false; error = e && e.message ? e.message : String(e); }
        results.push({ name: tc.name, pass, error, ms: Math.round(performance.now() - s) });
      }
      out.push({ name: g.name, tests: results });
    }
    // restore user plan
    try { App._setSaved(savedScenarios); App._replaceState(savedState); location.hash = savedHash || ''; App.closeModal(); document.body.classList.remove('sidebar-open'); const th = document.getElementById('toasts'); if (th) th.innerHTML = ''; } catch (e) { console.error('QA restore failed', e); }
    window.__QA_RUNNING = false;
    const all = out.flatMap((g) => g.tests);
    const summary = { total: all.length, passed: all.filter((t) => t.pass).length, failed: all.filter((t) => !t.pass).length, ms: Math.round(performance.now() - t0), ranAt: new Date().toISOString(), viewport: `${window.innerWidth}x${window.innerHeight}`, groups: out };
    return summary;
  }
  return { run, groups };
})();
